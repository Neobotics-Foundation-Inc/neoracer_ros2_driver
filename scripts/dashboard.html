  }
  :root {
    --red: #FF0033;
    --red-deep: #B80025;
    --ok: #22C55E;
    --ok-deep: #189446;
    --warn: #FFC847;
    --warn-deep: #DFA92B;
    --ink-on-ok: #0B0B0F;
    --ink-on-warn: #1D1D27;
    --head: 'Kernel', 'Space Grotesk', sans-serif;
    --body: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
    --sweep: 760ms cubic-bezier(0.77, 0, 0.18, 1);
    --bar-h: 64px;
    --gap: 16px;
    --hit: 40px;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #09090B;
    --surface: #131317;
    --surface-2: #1D1D23;
    --edge: #26262D;
    --ink: #FFFFFF;
    --ink-2: #B4B5BC;
    --ink-3: #8A8B93;
    --quiet: #4A4B53;
    --well: #000000;
    --mark: #FFC847;
    --bar-glass: rgb(9 9 11 / 0.72);
    --veil: rgb(9 9 11 / 0.6);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #EDEDF0;
    --surface: #FFFFFF;
    --surface-2: #E4E4E8;
    --edge: #D9D9DE;
    --ink: #1D1D27;
    --ink-2: #55565F;
    --ink-3: #636469;
    --quiet: #C4C4CA;
    --well: #F6F6F8;
    --mark: #A86E00;
    --bar-glass: rgb(255 255 255 / 0.72);
    --veil: rgb(237 237 240 / 0.6);
  }
  @media (pointer: coarse) { :root { --hit: 44px; } }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: var(--body); background: var(--page); color: var(--ink); font-size: 15px; line-height: 1.45; min-height: 100dvh; }
  .mono { font-family: var(--mono); }
  .num { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  /* ── Status: a whole box in its colour ── */
  .s-ok { background: var(--ok); color: var(--ink-on-ok); }
  .s-caution { background: var(--warn); color: var(--ink-on-warn); }
  .s-fault { background: var(--red); color: #FFFFFF; }
  .s-off { background: var(--surface-2); color: var(--ink-3); }
  .state { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; }
  .state i { width: 9px; height: 9px; flex: none; background: currentColor; }

  /* ── The bar: glass over the page ── */
  header.bar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px; height: var(--bar-h);
    background: var(--bar-glass);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    backdrop-filter: blur(18px) saturate(1.4);
    border-bottom: 1px solid var(--edge);
  }
  .bar .logo { display: grid; flex: none; }
  .bar .logo img { grid-area: 1 / 1; height: 76px; margin: -6px -14px; display: block; }
  [data-theme="dark"] .bar .logo .for-light, [data-theme="light"] .bar .logo .for-dark { visibility: hidden; }
  .bar .divider { width: 1px; height: 26px; background: var(--edge); flex: none; }
  .bar h1 { font-family: var(--head); font-size: 18px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .bar h1 .thin { color: var(--ink-3); }
  .bar .meta { margin-left: auto; display: flex; align-items: center; gap: 12px; flex: none; }
  .live { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .live i { width: 9px; height: 9px; background: var(--ok); transition: background 600ms ease-out; }
  .live.beat i { background: var(--ink); transition: none; }
  .live.lost i { background: var(--warn); }
  .live.wait i { background: var(--ink-3); }

  /* the theme: one switch, the picked side solid red */
  .seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 999px; overflow: hidden; background: var(--surface); flex: none; }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 14px; min-height: 36px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--red); color: #FFFFFF; }
  @media (pointer: coarse) { .seg button { min-height: var(--hit); } }

  /* the sweep: the new theme slides across from the side of the button pressed, a red edge leading it */
  .sweep-band { display: none; position: fixed; top: 0; left: 0; width: 14px; height: 100vh; background: var(--red); z-index: 1000; pointer-events: none; view-transition-name: sweep-band; }
  html.sweeping .sweep-band { display: block; }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-group(sweep-band) { animation: none; }
  html[data-sweep="ltr"]::view-transition-new(root) { animation: reveal-ltr var(--sweep) both; }
  html[data-sweep="rtl"]::view-transition-new(root) { animation: reveal-rtl var(--sweep) both; }
  html[data-sweep="ltr"]::view-transition-new(sweep-band) { animation: band-ltr var(--sweep) both; }
  html[data-sweep="rtl"]::view-transition-new(sweep-band) { animation: band-rtl var(--sweep) both; }
  @keyframes reveal-ltr { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes reveal-rtl { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0 0 0 0); } }
  @keyframes band-ltr { from { transform: translateX(-14px); } to { transform: translateX(100vw); } }
  @keyframes band-rtl { from { transform: translateX(100vw); } to { transform: translateX(-14px); } }

  /* ── Buttons: pills; the main one solid red ── */
  .btn {
    appearance: none; position: relative; overflow: hidden;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: var(--hit); padding: 0 18px;
    border: 1px solid var(--edge); border-radius: 999px;
    background: var(--surface-2); color: var(--ink);
    font: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    cursor: pointer; white-space: nowrap; user-select: none; -webkit-user-select: none; touch-action: manipulation;
    -webkit-touch-callout: none; text-decoration: none;
    transition: filter 120ms ease, transform 80ms ease;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--red); border-color: var(--red); color: #FFFFFF; }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: var(--ink-on-ok); }
  .btn.bad { background: var(--red); border-color: var(--red); color: #FFFFFF; }
  .btn.big { min-height: 64px; border-radius: 18px; font-family: var(--head); font-size: 20px; letter-spacing: 0.04em; width: 100%; }
  .btn:disabled, .btn:disabled:hover { background: var(--surface-2); border-color: var(--surface-2); color: var(--ink-3); cursor: not-allowed; filter: none; transform: none; }
  .btn svg { display: block; flex: none; }
  .btn .k { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 6px; background: var(--page); color: var(--ink-2); letter-spacing: 0; text-transform: none; }
  .btn.primary .k, .btn.bad .k { background: var(--red-deep); color: #FFFFFF; }
  .btn.ok .k { background: var(--ok-deep); color: var(--ink-on-ok); }
  /* a hold to confirm: the fill grows while held, the action runs when it is full */
  .btn.hold::before { content: ''; position: absolute; inset: 0; width: calc(var(--p, 0) * 100%); background: var(--red-deep); }
  .btn.hold > * { position: relative; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* ── Panels ── */
  .panel { background: var(--surface); border: 1px solid var(--edge); border-radius: 24px; padding: 18px 20px 20px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .title { font-family: var(--head); font-size: 18px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1; }
  .title::after { content: ''; display: block; width: 28px; height: 4px; margin-top: 8px; background: var(--red); }
  .sub { font-family: var(--head); font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
  .count { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
  .note { font-size: 13px; color: var(--ink-2); }
  .note.caution { background: var(--warn); color: var(--ink-on-warn); font-weight: 600; padding: 10px 14px; border-radius: 14px; }

  /* ── The summary: the page's numbers in its own ink turned over, no status colour ── */
  .summary { container-type: inline-size; background: var(--ink); color: var(--page); border-radius: 24px; padding: 18px 24px; }
  .summary .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 14px 20px; }
  .summary .stat { container-type: inline-size; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  /* each value at most --len characters wide (fixed per stat so a changing number does not jump), sized to its cell */
  .summary .stat b { font-family: var(--head); font-weight: 700; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: min(34px, calc(100cqi * 1.3 / var(--len, 6))); }
  .summary .stat > span { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .summary .stat small { font-family: var(--body); font-size: 0.5em; font-weight: 700; letter-spacing: 0.04em; margin-left: 4px; }
  /* where a summary's n values no longer fit one row, even rows instead of a straggler (each needs 118 px + 20 px gap
     of the width less 80 px of padding: one row of 8 needs 1164 px, of 7 1026, of 6 888, of 5 750) */
  @media (min-width: 701px) and (max-width: 1163px) { .summary .stats.n8 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (min-width: 701px) and (max-width: 1025px) { .summary .stats.n7 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (min-width: 701px) and (max-width: 887px) { .summary .stats.n6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 701px) and (max-width: 749px) { .summary .stats.n5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  /* ── Fields: a name, its unit, the box; numbers with steppers that repeat while held ── */
  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 14px; }
  /* the name, its unit under it in full, the box at the bottom (so a row's boxes line up whatever the units' length) */
  .field { display: flex; flex-direction: column; justify-content: space-between; gap: 6px; min-width: 0; }
  .field > .name { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; row-gap: 1px; font-size: 13px; font-weight: 700; }
  .field > .name .unit { flex-basis: 100%; order: 2; font-weight: 500; color: var(--ink-3); font-size: 12px; line-height: 1.3; }
  .field > .name b { font-family: var(--head); font-size: 18px; color: var(--ink); margin-left: auto; }
  .field.wide > .name .unit { flex-basis: auto; order: 0; }
  .field.wide { grid-column: 1 / -1; }
  input[type="number"], input[type="text"], select {
    width: 100%; min-width: 0; height: var(--hit);
    background: var(--well); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 12px;
    font-family: var(--mono); font-size: 15px; padding: 0 12px;
  }
  @media (pointer: coarse) { input[type="number"], input[type="text"], select { font-size: 16px; } }
  input:focus, select:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
  input:disabled { color: var(--ink-3); background: var(--surface-2); }
  input[type="number"] { -moz-appearance: textfield; appearance: textfield; text-align: center; }
  input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  select { cursor: pointer; }
  .stepper { display: grid; grid-template-columns: var(--hit) minmax(0, 1fr) var(--hit); gap: 6px; }
  .stepper button { appearance: none; border: 1px solid var(--edge); background: var(--surface-2); color: var(--ink); border-radius: 12px; font: inherit; font-size: 20px; font-weight: 700; line-height: 1; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .stepper button:active { background: var(--red); border-color: var(--red); color: #FFFFFF; }
  .stepper button:disabled { color: var(--ink-3); cursor: not-allowed; }

  /* a slider: a red fill to the value, a square thumb big enough for a thumb. Its field takes the pointer (kit.js
     moves it by a sideways drag only) and lets an up or down swipe scroll the page */
  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: var(--hit); background: transparent; pointer-events: none;
    --v: 0%;
  }
  .field:has(> input[type="range"]) { touch-action: pan-y; }
  input[type="range"]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--red) var(--v), var(--surface-2) var(--v)); }
  input[type="range"]::-moz-range-track { height: 10px; border-radius: 5px; background: var(--surface-2); }
  input[type="range"]::-moz-range-progress { height: 10px; border-radius: 5px; background: var(--red); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -9px; border-radius: 8px; background: var(--red); border: 3px solid var(--surface); }
  input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 8px; background: var(--red); border: 3px solid var(--surface); }

  /* ── An info chip: hover or tap shows the tip, tap again or anywhere else hides it ── */
  .info { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; margin-left: 6px; border-radius: 5px; background: var(--surface-2); color: var(--ink-2); font: 700 11px var(--body); letter-spacing: 0; text-transform: none; cursor: help; flex: none; vertical-align: middle; }
  .info::after { content: ''; position: absolute; inset: -12px; }
  .info:hover, .info.open { background: var(--red); color: #FFFFFF; }
  .info .tip { display: none; position: absolute; top: 26px; left: -10px; z-index: 60; width: min(280px, 76vw); padding: 12px 14px; background: var(--ink); color: var(--page); border-radius: 14px; font: 500 13px/1.5 var(--body); letter-spacing: normal; text-transform: none; text-align: left; white-space: normal; }
  .info.right .tip { left: auto; right: -10px; }
  .info:hover .tip, .info.open .tip { display: block; }

  /* ── A toast: what just happened ── */
  #toast { position: fixed; left: 50%; bottom: 24px; z-index: 90; transform: translate(-50%, 16px); background: var(--ink); color: var(--page); border-radius: 999px; padding: 12px 22px; font-weight: 700; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 160ms ease-out, transform 160ms ease-out; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ── Views: lidar, charts, the camera ── */
  .view { position: relative; background: var(--well); border: 1px solid var(--edge); border-radius: 16px; overflow: hidden; min-height: 0; }
  .view canvas { display: block; width: 100%; height: 100%; }
  .view.square { aspect-ratio: 1; }
  .view.cam { aspect-ratio: 4 / 3; background: #000000; }
  .view .cap { position: absolute; left: 12px; bottom: 10px; font-size: 12px; font-weight: 600; color: var(--ink-2); pointer-events: none; }
  .view .cap.top { top: 10px; bottom: auto; }
  .view .zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
  .view .zoom button { appearance: none; width: var(--hit); height: var(--hit); border-radius: 12px; border: 1px solid var(--edge); background: var(--surface); color: var(--ink); font: 700 20px var(--body); cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
  .legend i.line { height: 3px; width: 16px; vertical-align: 3px; }

  /* ── Tables ── */
  .table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); padding: 8px 10px; border-bottom: 1px solid var(--edge); white-space: nowrap; }
  .table td { padding: 8px 10px; border-top: 1px solid var(--edge); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .table .pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; }
  .scrollx { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* no answer from the car: what is shown is the last update, greyed so it does not pass for now */
  main.lost .panel, main.lost .summary { filter: grayscale(1); }

  /* a key's hint means nothing on a screen with no keyboard */
  @media (hover: none) and (pointer: coarse) { .btn .k { display: none; } }

  /* a tablet held upright: the bar keeps one row and the whole name by closing up */
  @media (min-width: 701px) and (max-width: 1000px) {
    header.bar { gap: 12px; }
    .bar .divider { display: none; }
    .bar .meta { gap: 8px; }
  }
  /* a phone: the bar in two rows (its controls, then the dashboard's whole name), scrolling away with the page */
  @media (max-width: 700px) {
    :root { --gap: 12px; }
    header.bar { position: relative; flex-wrap: wrap; height: auto; padding: 8px 12px 10px; gap: 8px; }
    .bar .divider, .live span { display: none; }
    .bar .logo img { height: 52px; margin: -6px -9px; }
    .bar h1 { order: 5; flex-basis: 100%; font-size: 16px; }
    .bar .meta { gap: 8px; }
    .bar .meta .btn { padding: 0 12px; }
    .seg button { padding: 0 10px; }
    .panel { padding: 16px; border-radius: 20px; }
    .summary { padding: 16px 18px; border-radius: 20px; }
    .summary .stats { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    .fields { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .live i, .btn, #toast { transition: none; }
  }

  /* ── NeoRacer System: the summary, the health and the log; the drive chain; the stack, autonomy and rates. On a
     screen 1280 x 640 or larger the whole board fits it, nothing to scroll; smaller, it stacks and scrolls. ── */
  /* ── The board: every part in its own area ── */
  main {
    padding: var(--gap);
    display: grid;
    gap: var(--gap);
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas:
      "lead lead"
      "h0 h1"
      "chain chain"
      "stack stack"
      "auton rates"
      "log log";
  }
  main.one-health { grid-template-areas: "lead lead" "h0 h0" "chain chain" "stack stack" "auton rates" "log log"; }
  .lead { grid-area: lead; }
  #health-0 { grid-area: h0; }
  #health-1 { grid-area: h1; }
  .area-chain { grid-area: chain; }
  .area-stack { grid-area: stack; }
  .area-auto { grid-area: auton; }
  .area-rates { grid-area: rates; }
  .area-log { grid-area: log; }

  /* ── The summary: three counts, in the page's own ink turned over, no status colour ── */
  .lead { container-type: inline-size; border-radius: 24px; padding: 22px 26px; display: flex; align-items: center; min-width: 0; background: var(--ink); color: var(--page); }
  .stats { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .stat { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  /* the three as large as the box allows, the longest ("10/13") on one line in a third of it */
  .stat b { font-family: var(--head); font-size: min(88px, 8.5cqi); font-weight: 700; line-height: 1; white-space: nowrap; }
  .stat span { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; }
  /* a big value as large as its box allows on one line: Kernel's capitals run 0.65 to 0.71 em (measured), so a value
     of --len characters fits at 100cqi / (0.75 x --len) */
  .fit { white-space: nowrap; font-size: min(var(--fit-max), calc(100cqi * 1.3 / var(--len, 10))); }

  .gauge { container-type: inline-size; border-radius: 24px; padding: 18px 22px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .gauge[hidden] { display: none; }
  .gauge .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .gauge .name { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .gauge .value { --fit-max: 72px; font-family: var(--head); font-weight: 700; line-height: 1; margin-top: auto; }
  .gauge .side { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; min-height: 17px; }
  .cells { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
  .cells i { height: 12px; }
  .s-ok .cells i { background: #189446; }
  .s-caution .cells i { background: #DFA92B; }
  .s-fault .cells i { background: #C70028; }
  .cells i.on { background: currentColor; }

  /* ── The drive chain: the RC and autonomy, two ways in that meet at the mux, then on to the motor ── */
  .chain {
    --stage-h: 56px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr);
    grid-template-areas: "rc l1 gp lg mux l3 th l4 esp" ". . au la mux l3 th l4 esp";
    row-gap: 8px;
  }
  .stage { min-width: 0; min-height: var(--stage-h); border-radius: 16px; padding: 10px 14px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .stage .name { font-family: var(--head); font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link { min-width: 96px; align-self: center; display: grid; grid-template-rows: auto auto auto; row-gap: 4px; padding: 0 10px; text-align: center; white-space: nowrap; }
  .link .t { font-size: 11.5px; color: var(--ink-2); }
  .link .r { font-size: 13px; font-weight: 700; }
  .link.down .r { color: var(--ink-3); }
  .link .wire { position: relative; height: 3px; background: var(--ink); }
  .link .wire::after { content: ''; position: absolute; right: -2px; top: -5px; border-left: 9px solid var(--ink); border-top: 6.5px solid transparent; border-bottom: 6.5px solid transparent; }
  .link.down .wire { background: repeating-linear-gradient(90deg, var(--ink-3) 0 8px, transparent 8px 14px); }
  .link.down .wire::after { border-left-color: var(--ink-3); }

  /* ── Tiles: nodes, autonomy, rates ── */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .tile { border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-height: 112px; min-width: 0; overflow: hidden; }
  .tile .top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; row-gap: 2px; }
  .tile .hz { font-family: var(--head); font-size: 18px; font-weight: 700; white-space: nowrap; }
  .tile .name { font-weight: 700; font-size: 16px; line-height: 1.2; overflow-wrap: anywhere; }
  .tile .name .detail { font-weight: 500; }
  .tile .restart { font-size: 11.5px; font-weight: 700; }
  .tile .topic { font-size: 11.5px; margin-top: auto; overflow-wrap: anywhere; }

  /* a rate on one line: its topic, its rate, and its last 60 s where the box has room for them */
  .rates { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
  .rate { container-type: inline-size; border-radius: 12px; padding: 7px 12px; min-width: 0; display: flex; align-items: center; }
  .rate .in { width: 100%; display: flex; align-items: center; gap: 10px; }
  .rate .topic { flex: 1; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rate .v { font-family: var(--head); font-size: 14px; font-weight: 700; white-space: nowrap; }
  .rate svg { flex: none; display: block; }
  .rate polyline { stroke: currentColor; }
  @container (max-width: 250px) { .rate svg { display: none; } }

  .log { flex: 1; min-height: 72px; background: var(--well); border: 1px solid var(--edge); border-radius: 14px; padding: 10px 14px; font-size: 12px; line-height: 1.55; overflow-y: auto; white-space: pre-wrap; color: var(--ink-2); }
  .log-dir { min-width: 0; color: var(--ink-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* (the kit greys the panels; the health boxes too) */
  main.lost .gauge { filter: grayscale(1); }

  /* ── The node graph: glass over the page ── */
  #graph-overlay { display: none; position: fixed; inset: 0; z-index: 100; flex-direction: column; background: var(--veil); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2); }
  #graph-overlay.open { display: flex; }
  .gbar { display: flex; align-items: center; gap: 16px; padding: 0 20px; height: var(--bar-h); background: var(--bar-glass); border-bottom: 1px solid var(--edge); }
  .gbar h2 { font-family: var(--head); font-size: 18px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .glegend { margin-left: auto; display: flex; gap: 18px; align-items: center; color: var(--ink-2); font-size: 13px; font-weight: 600; }
  .glegend .chip { display: inline-flex; align-items: center; gap: 7px; }
  .glegend .sw-node { width: 18px; height: 12px; border-radius: 999px; background: var(--red); }
  .glegend .sw-topic { width: 16px; height: 11px; border-radius: 3px; background: var(--surface); border: 1px solid var(--ink-3); }
  #graph-svg { flex: 1; width: 100%; touch-action: none; }
  #graph-svg .gnode rect { fill: var(--red); }
  #graph-svg .gnode text { fill: #FFFFFF; font-family: var(--body); font-size: 12px; font-weight: 700; }
  #graph-svg .gtopic rect { fill: var(--surface); stroke: var(--quiet); stroke-width: 1; }
  #graph-svg .gtopic text { fill: var(--ink); font-family: var(--mono); font-size: 11px; }
  #graph-svg .gedge { stroke: var(--quiet); stroke-width: 1.4; fill: none; }
  #graph-svg .arrowhead { fill: var(--ink-3); }
  #graph-svg g.dim, #graph-svg .gedge.dim { opacity: 0.15; }
  #graph-svg .gedge.hot { stroke: var(--ink); stroke-width: 2; }
  #graph-svg .gnode, #graph-svg .gtopic { cursor: grab; }

  /* ── One screen, nothing to scroll: the flag, the health and the log; the chain; the stack, autonomy and rates ── */
  @media (min-width: 1280px) and (min-height: 640px) {
    :root { --gap: 14px; --bar-h: 56px; }
    main {
      height: calc(100dvh - var(--bar-h));
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-template-rows: minmax(132px, 0.72fr) auto minmax(0, 2.2fr);
      grid-template-areas:
        "lead lead lead lead lead h0 h0 h1 h1 log log log"
        "chain chain chain chain chain chain chain chain chain chain chain chain"
        "stack stack stack stack stack auton auton auton rates rates rates rates";
    }
    main.one-health {
      grid-template-areas:
        "lead lead lead lead lead h0 h0 h0 h0 log log log"
        "chain chain chain chain chain chain chain chain chain chain chain chain"
        "stack stack stack stack stack auton auton auton rates rates rates rates";
    }
    main > * { min-height: 0; }
    .panel { padding: 14px 18px 16px; overflow: hidden; gap: 10px; }
    .title { font-size: 16px; }
    .title::after { width: 24px; height: 3px; margin-top: 7px; }
    .lead { padding: 16px 24px; }
    .stat b { font-size: min(88px, 8.5cqi, 8.5vh); }
    .gauge { padding: 14px 18px; gap: 6px; }
    .gauge .value { --fit-max: min(64px, 7.5vh); }
    .cells i { height: 10px; }
    .chain { --stage-h: 48px; row-gap: 6px; }
    .stage { padding: 7px 14px; gap: 2px; line-height: 1.15; }
    /* the tiles share their panel's height */
    .tiles, .rates { flex: 1; min-height: 0; grid-auto-rows: minmax(0, 1fr); }
    .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .area-auto .tiles, .rates { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    /* a tile in three lines: its state, its name, its topic with the rate beside it */
    .tile { min-height: 0; padding: 8px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "state state" "name name" "restart restart" "topic hz"; align-content: center; gap: 2px 8px; }
    .tile .top-row { display: contents; }
    .tile .top-row .state { grid-area: state; }
    .tile .name { grid-area: name; font-size: 14.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .tile .restart { grid-area: restart; }
    .tile .topic { grid-area: topic; margin-top: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .hz { grid-area: hz; font-size: 14px; align-self: end; }
    .rate { padding: 3px 12px; }
    .log { min-height: 0; }
  }
  /* one screen, short: a tile to check says whether it restarts in its topic's place (the rates show the topic) */
  @media (min-width: 1280px) and (min-height: 640px) and (max-height: 820px) {
    .tile.has-note .topic { display: none; }
    /* a name's detail in brackets only where there is a line for it */
    .tile .name { display: block; white-space: nowrap; text-overflow: ellipsis; }
    .tile .name .detail { display: none; }
  }
  /* narrower than the chain's five stages need: the chain top to bottom, autonomy beside the mux */
  @media (max-width: 1199px) {
    .chain {
      grid-template-columns: minmax(0, 1fr) 84px minmax(0, 1fr);
      grid-template-areas: "rc rc rc" "l1 l1 l1" "gp gp gp" "lg lg lg" "mux la au" "l3 l3 l3" "th th th" "l4 l4 l4" "esp esp esp";
      row-gap: 0;
    }
    .link { min-width: 0; padding: 6px 0 6px 24px; grid-template-columns: 3px auto; grid-template-rows: auto auto; column-gap: 14px; row-gap: 1px; text-align: left; justify-content: start; }
    .link .t { grid-area: 1 / 2; }
    .link .r { grid-area: 2 / 2; }
    .link .wire { grid-area: 1 / 1 / 3 / 2; width: 3px; height: 34px; }
    .link .wire::after { right: auto; top: auto; bottom: -2px; left: -5px; border-left: 6.5px solid transparent; border-right: 6.5px solid transparent; border-top: 9px solid var(--ink); border-bottom: 0; }
    .link.down .wire { background: repeating-linear-gradient(180deg, var(--ink-3) 0 6px, transparent 6px 11px); }
    .link.down .wire::after { border-top-color: var(--ink-3); border-left-color: transparent; }
    /* autonomy's /drive: from the right, into the mux */
    .link.la { padding: 0 8px; grid-template-columns: auto; grid-template-rows: auto auto auto; row-gap: 6px; justify-content: stretch; text-align: center; }
    .link.la .t { grid-area: 1 / 1; }
    .link.la .wire { grid-area: 2 / 1; width: auto; height: 3px; }
    .link.la .r { grid-area: 3 / 1; }
    .link.la .wire::after { left: -2px; top: -5px; bottom: auto; border-right: 9px solid var(--ink); border-top: 6.5px solid transparent; border-bottom: 6.5px solid transparent; border-left: 0; }
    .link.la.down .wire { background: repeating-linear-gradient(90deg, var(--ink-3) 0 8px, transparent 8px 14px); }
    .link.la.down .wire::after { border-right-color: var(--ink-3); border-top-color: transparent; }
  }
  @media (max-width: 700px) {
    #graph-btn .word { display: none; }
    .bar .meta #graph-btn { width: var(--hit); padding: 0; }
    .chain { grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr); }
    .stage { padding: 10px 12px; }

    .lead, .gauge { padding: 18px; border-radius: 20px; }
    .head { flex-wrap: wrap; }
    .tiles { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
    .tile { min-height: 0; padding: 12px; }
    .tile .name { font-size: 15px; }
    .rates { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .glegend span:last-child { display: none; }
  }
</style>

<script>
/* ── NeoRacer dashboard kit, the script (the same block in every dashboard) ── */
const KIT = (() => {
  const html = document.documentElement;
  const THEME_KEY = 'neoracer-dashboard-theme';

  function post(path, body) {
    return fetch(path, { method: 'POST', body: body ? JSON.stringify(body) : null });
  }

  function toast(msg) {
    let t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      t.setAttribute('role', 'status');
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* the theme tokens for drawing on a canvas, read again when the theme changes */
  let tok = null;
  function tokens() {
    if (tok) return tok;
    const s = getComputedStyle(html);
    const v = n => s.getPropertyValue(n).trim();
    tok = {
      ink: v('--ink'), ink2: v('--ink-2'), ink3: v('--ink-3'), quiet: v('--quiet'), edge: v('--edge'),
      red: v('--red'), ok: v('--ok'), warn: v('--warn'), mark: v('--mark'), well: v('--well'), surface: v('--surface'),
      body: "'Space Grotesk', 'Helvetica Neue', Arial, sans-serif", head: "'Kernel', 'Space Grotesk', sans-serif",
    };
    return tok;
  }

  /* ── the theme switch: the new theme sweeps in from the side of the button pressed ── */
  function showTheme() {
    for (const b of document.querySelectorAll('.seg button[data-pick]')) {
      b.setAttribute('aria-pressed', String(b.dataset.pick === html.dataset.theme));
    }
  }
  function setTheme(theme) {
    html.dataset.theme = theme;
    localStorage.setItem(THEME_KEY, theme);
    tok = null;
    showTheme();
    window.dispatchEvent(new Event('nb-theme'));
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('.seg button[data-pick]');
    if (!b || b.dataset.pick === html.dataset.theme) return;
    // (a browser without view transitions, a viewer who asked for less motion, or a hidden page, where the browser
    // refuses a transition: the theme changes at once)
    if (!document.startViewTransition || document.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setTheme(b.dataset.pick);
      return;
    }
    html.dataset.sweep = b.dataset.pick === 'light' ? 'ltr' : 'rtl';
    const sweep = document.startViewTransition(() => {
      html.classList.add('sweeping');
      setTheme(b.dataset.pick);
    });
    sweep.finished.then(() => html.classList.remove('sweeping'));
  });

  /* ── info chips: hover reads one; a tap pins it, a tap anywhere else lets it go ── */
  document.addEventListener('click', e => {
    const hit = e.target.closest('.info');
    for (const el of document.querySelectorAll('.info.open')) if (el !== hit) el.classList.remove('open');
    if (hit) hit.classList.toggle('open');
  });

  /* ── the bar's square: a beat on each answer, yellow and greyed data when the car stops answering ── */
  const live = {
    ok() {
      const l = document.getElementById('live');
      l.classList.remove('lost', 'wait');
      l.title = '';
      l.querySelector('span').textContent = 'Live';
      document.querySelector('main').classList.remove('lost');
      l.classList.add('beat');
      requestAnimationFrame(() => requestAnimationFrame(() => l.classList.remove('beat')));
    },
    lost(err) {
      const l = document.getElementById('live');
      l.classList.add('lost');
      l.title = err.message;
      l.querySelector('span').textContent = 'No answer';
      document.querySelector('main').classList.add('lost');
    },
  };

  /* a canvas the size it is shown at, in device pixels; drawing in CSS pixels */
  function fitCanvas(c) {
    const r = c.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const W = Math.max(1, Math.round(r.width * dpr)), H = Math.max(1, Math.round(r.height * dpr));
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    const x = c.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { x, w: r.width, h: r.height };
  }

  /* ── a button that repeats while held: a tap steps once as it lets go, a hold steps from `first` ms on, `factor`
        faster each time down to `min`. It follows one finger: a second one on it is ignored (two would run two
        repeats, one never stopped), and a scroll that starts on it steps nothing (the browser cancels the pointer) ── */
  function repeat(b, fn, first, min, factor) {
    let timer = 0, held = null, stepped = false;
    const end = e => { if (e.pointerId === held) { clearTimeout(timer); held = null; } };
    b.addEventListener('pointerdown', e => {
      if (e.button !== 0 || held !== null) return;
      e.preventDefault();
      held = e.pointerId;
      stepped = false;
      b.setPointerCapture(held);
      let delay = first;
      const again = () => { stepped = true; fn(); delay = Math.max(min, delay * factor); timer = setTimeout(again, delay); };
      timer = setTimeout(again, delay);
    });
    b.addEventListener('pointerup', e => {
      if (e.pointerId !== held) return;
      const r = b.getBoundingClientRect();
      if (!stepped && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) fn();
      end(e);
    });
    for (const ev of ['pointercancel', 'lostpointercapture']) b.addEventListener(ev, end);
    b.addEventListener('click', e => { if (e.detail === 0) fn(); });  // the keyboard's press (Enter, Space)
    b.addEventListener('contextmenu', e => e.preventDefault());
  }

  /* ── a number field with − and +: a tap steps once, holding repeats faster; the field's step, or for any value
        a tenth of its size ── */
  function stepOf(input) {
    const s = input.getAttribute('step');
    if (s && s !== 'any') return { step: parseFloat(s), dec: (s.split('.')[1] || '').length };
    const v = Math.abs(parseFloat(input.value));
    const e = v > 0 ? Math.floor(Math.log10(v)) - 1 : -2;
    return { step: Math.pow(10, e), dec: Math.max(0, -e) };
  }
  function stepper(input) {
    const wrap = document.createElement('div');
    wrap.className = 'stepper';
    const make = (txt, dir, label) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = txt;
      b.setAttribute('aria-label', label);
      repeat(b, () => {
        if (input.disabled) return;
        const { step, dec } = stepOf(input);
        let v = (parseFloat(input.value) || 0) + dir * step;
        if (input.min !== '') v = Math.max(parseFloat(input.min), v);
        if (input.max !== '') v = Math.min(parseFloat(input.max), v);
        input.value = v.toFixed(dec);
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
      }, 350, 40, 0.75);
      return b;
    };
    input.replaceWith(wrap);
    wrap.append(make('−', -1, 'Less'), input, make('+', 1, 'More'));
    return wrap;
  }

  /* ── a hold to confirm: what cannot be undone runs only once the button has been held full ── */
  function hold(btn, fn, ms = 900) {
    btn.classList.add('hold');
    let raf = 0;
    const set = p => btn.style.setProperty('--p', p);
    const stop = () => { cancelAnimationFrame(raf); raf = 0; set(0); };
    const go = () => {
      if (raf || btn.disabled) return;
      const start = performance.now();
      const step = now => {
        const p = Math.min(1, (now - start) / ms);
        set(p);
        if (p >= 1) { raf = 0; set(0); fn(); } else raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    };
    btn.addEventListener('pointerdown', e => { if (e.button === 0) { btn.setPointerCapture(e.pointerId); go(); } });
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) btn.addEventListener(ev, stop);
    btn.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) { e.preventDefault(); go(); } });
    btn.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') stop(); });
    btn.addEventListener('contextmenu', e => e.preventDefault());
  }

  /* ── zoom a view: the wheel, two fingers, or its − and + (held, they repeat) ── */
  function zoomable(view, get, set, min, max) {
    const clamp = v => Math.min(max, Math.max(min, v));
    view.addEventListener('wheel', e => { e.preventDefault(); set(clamp(get() * (e.deltaY > 0 ? 1.2 : 1 / 1.2))); }, { passive: false });
    let d0 = 0, v0 = 0;
    const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    view.addEventListener('touchstart', e => {
      if (e.touches.length === 2) { e.preventDefault(); d0 = dist(e.touches); v0 = get(); }
    }, { passive: false });
    view.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && d0 > 0) { e.preventDefault(); set(clamp(v0 * d0 / dist(e.touches))); }
    }, { passive: false });
    view.addEventListener('touchend', e => { if (e.touches.length < 2) d0 = 0; });
    for (const b of view.querySelectorAll('.zoom button')) {
      const f = b.dataset.zoom === 'in' ? 1 / 1.15 : 1.15;
      repeat(b, () => set(clamp(get() * f)), 380, 90, 1);
    }
  }

  /* a slider's red fill follows its value */
  function fill(range) {
    const lo = parseFloat(range.min || 0), hi = parseFloat(range.max || 100);
    range.style.setProperty('--v', `${((parseFloat(range.value) - lo) / (hi - lo)) * 100}%`);
  }
  document.addEventListener('input', e => { if (e.target.type === 'range') fill(e.target); });

  /* ── a slider (the car's throttle cap) moves only with a sideways drag, by as far as the finger or mouse travels.
        The browser's own slider jumps to wherever it is touched, so a scroll that started on it, a tap or a stray
        click set the speed; the kit takes the pointer from it (pointer-events: none) and keeps its keyboard ── */
  const THUMB = 28;
  let slide = null;
  document.addEventListener('pointerdown', e => {
    const field = e.button === 0 && e.target.closest('.field');
    const input = field && field.querySelector(':scope > input[type="range"]');
    if (!input || input.disabled) return;
    const r = input.getBoundingClientRect();
    if (e.clientY < r.top || e.clientY > r.bottom) return;
    slide = { field, input, id: e.pointerId, x: e.clientX, y: e.clientY, v: parseFloat(input.value), span: r.width - THUMB, moving: false };
  });
  document.addEventListener('pointermove', e => {
    if (!slide || e.pointerId !== slide.id) return;
    const dx = e.clientX - slide.x, dy = e.clientY - slide.y;
    if (!slide.moving) {
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      if (Math.abs(dy) >= Math.abs(dx)) { slide = null; return; }
      slide.moving = true;
      slide.field.setPointerCapture(e.pointerId);
      slide.input.focus({ preventScroll: true });
    }
    const { input } = slide, lo = parseFloat(input.min), hi = parseFloat(input.max), step = parseFloat(input.step);
    const v = Math.min(hi, Math.max(lo, slide.v + dx / slide.span * (hi - lo)));
    const next = (Math.round((v - lo) / step) * step + lo).toFixed(stepOf(input).dec);
    if (next !== input.value) { input.value = next; input.dispatchEvent(new Event('input', { bubbles: true })); }
  });
  for (const ev of ['pointerup', 'pointercancel']) document.addEventListener(ev, e => {
    if (!slide || e.pointerId !== slide.id) return;
    if (!slide.moving && ev === 'pointerup') slide.input.focus({ preventScroll: true });
    slide = null;
  });

  /* ── a slider that applies as it moves shows what the car has. Call the returned function as a poll leaves; call
        what that returns with the car's value. The slider takes it unless an edit made here was still on its way
        when the poll left, or a finger is on the slider. Without this, a service restarted under the page (back at
        the yaml's speed) left the old speed showing, and the next nudge jumped the car from 0 to it ── */
  function liveRange(input, label, send) {
    let sent = 0, answered = 0;
    input.addEventListener('input', () => {
      label.textContent = input.value;
      const n = ++sent;
      send(parseFloat(input.value)).finally(() => { answered = Math.max(answered, n); });
    });
    return () => {
      const quiet = answered === sent;
      return v => {
        if (!quiet || answered !== sent || (slide && slide.input === input) || parseFloat(input.value) === v) return;
        input.value = v;
        label.textContent = input.value;
        fill(input);
      };
    };
  }

  /* ── the lidar from above: 0 deg is the nose (up), positive to the right; range rings each metre ── */
  function drawLidar(c, scan, ov, view, active) {
    const { x, w, h } = fitCanvas(c);
    const t = tokens();
    const cx = w / 2, cy = h / 2, scale = Math.min(w, h) / 2 / view;
    const L = ov.la ? Math.min(ov.la, view) : view;
    x.clearRect(0, 0, w, h);
    x.strokeStyle = t.edge;
    x.lineWidth = 1;
    for (let r = 1; r < view + 0.01; r++) { x.beginPath(); x.arc(cx, cy, r * scale, 0, 2 * Math.PI); x.stroke(); }
    x.fillStyle = t.ink;
    for (const [deg, r] of scan) {
      const a = deg * Math.PI / 180;
      x.fillRect(cx + Math.sin(a) * r * scale - 1.25, cy - Math.cos(a) * r * scale - 1.25, 2.5, 2.5);
    }
    const ray = (deg, r, color, lw, dash) => {
      const a = deg * Math.PI / 180;
      x.strokeStyle = color; x.lineWidth = lw; x.setLineDash(dash || []);
      x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.sin(a) * r * scale, cy - Math.cos(a) * r * scale); x.stroke();
      x.setLineDash([]);
    };
    if (ov.mode === 'static') {
      for (const s of [1, -1]) {  // the window's edges, then the distance measured inside it
        ray(s * ov.look_angle - ov.window / 2, L, t.ink3, 1);
        ray(s * ov.look_angle + ov.window / 2, L, t.ink3, 1);
        ray(s * ov.look_angle, Math.min(s > 0 ? ov.right : ov.left, view), t.red, 3);
      }
    } else if (ov.width !== undefined) {
      ray(-ov.width, L, t.ink3, 1);
      ray(ov.width, L, t.ink3, 1);
      // standing by (another controller drives): the heading it would take, dashed
      ray(ov.target_deg, L, t.red, 3, active ? [] : [7, 6]);
    }
    x.fillStyle = t.red;
    x.fillRect(cx - 5, cy - 9, 10, 18);  // the car
  }

  /* ── a time chart: each series scaled to its own largest value, the setpoint dashed at zero, tuning changes as
        dashed marks, an optional band along the bottom (which controller drove) ── */
  function drawSeries(c, series, title, marks, bands) {
    const { x, w, h } = fitCanvas(c);
    const t = tokens();
    x.clearRect(0, 0, w, h);
    const top = 26, bottom = h - 22;
    const mid = (top + bottom) / 2, half = (bottom - top) / 2;
    if (bands && bands.length > 1) {
      const b0 = bands[0][0], b1 = bands[bands.length - 1][0];
      for (let i = 0; i < bands.length - 1; i++) {
        const px = (bands[i][0] - b0) / (b1 - b0 || 1) * w;
        const pw = Math.max(1, (bands[i + 1][0] - bands[i][0]) / (b1 - b0 || 1) * w + 0.5);
        x.fillStyle = bands[i][1] ? t.ink : t.quiet;
        x.fillRect(px, h - 6, pw, 6);
      }
    }
    x.strokeStyle = t.quiet; x.lineWidth = 1; x.setLineDash([4, 4]);
    x.beginPath(); x.moveTo(0, mid); x.lineTo(w, mid); x.stroke();
    x.setLineDash([]);
    for (const s of series) {
      if (s.pts.length < 2) continue;
      const t0 = s.pts[0][0], t1 = s.pts[s.pts.length - 1][0];
      const max = Math.max(0.2, ...s.pts.map(p => Math.abs(p[1])));
      x.strokeStyle = t[s.color]; x.lineWidth = 2; x.lineJoin = 'round'; x.beginPath();
      s.pts.forEach((p, i) => {
        const px = (p[0] - t0) / (t1 - t0 || 1) * w, py = mid - p[1] / max * half;
        i ? x.lineTo(px, py) : x.moveTo(px, py);
      });
      x.stroke();
      s.max = max;
    }
    const s0 = series[0];
    if (marks && s0 && s0.pts.length > 1) {
      const t0 = s0.pts[0][0], t1 = s0.pts[s0.pts.length - 1][0];
      x.font = `600 11px ${t.body}`;
      for (const [tm, label] of marks) {
        if (tm < t0 || tm > t1) continue;
        const px = (tm - t0) / (t1 - t0 || 1) * w;
        x.strokeStyle = t.mark; x.lineWidth = 2; x.setLineDash([6, 4]);
        x.beginPath(); x.moveTo(px, top); x.lineTo(px, bottom); x.stroke();
        x.setLineDash([]);
        x.fillStyle = t.mark;
        x.fillText(label, Math.min(px + 5, w - x.measureText(label).width - 4), top + 12);
      }
    }
    x.font = `600 11px ${t.body}`;
    x.fillStyle = t.ink2;
    if (s0 && s0.pts.length > 1) {
      const k = s0.scale || 1, u = s0.unit || '', d = s0.digits ?? 2;
      const t0 = s0.pts[0][0], t1 = s0.pts[s0.pts.length - 1][0];
      x.fillText(`+${(s0.max * k).toFixed(d)} ${u}`, 6, top + 12);
      x.fillText(`0 ${u}`, 6, mid - 5);
      x.fillText(`-${(s0.max * k).toFixed(d)} ${u}`, 6, bottom - 4);
      x.fillText(`${t0.toFixed(1)} s`, 6, h - 9);
      const end = `${t1.toFixed(1)} s`;
      x.fillText(end, w - x.measureText(end).width - 6, h - 9);
    }
    x.fillStyle = t.ink;
    x.font = `700 12px ${t.body}`;
    x.fillText(title(series), 6, 16);
  }

  /* ── the camera with the detector's boxes: the target red, the rest white, the stop size dashed yellow, the
        centre line the steering chases ── */
  function drawCamera(c, img, last, safetyArea) {
    const { x, w, h } = fitCanvas(c);
    x.drawImage(img, 0, 0, w, h);
    if (!last) return;
    const t = tokens();
    const [W, H] = last.res[0] ? last.res : [w, h];
    const sx = w / W, sy = h / H;
    x.font = `700 12px ${t.body}`;
    for (const d of last.detections) {
      const isTgt = last.target && d.cx === last.target.cx && d.cy === last.target.cy;
      const bx = (d.cx - d.w / 2) * sx, by = (d.cy - d.h / 2) * sy;
      x.strokeStyle = isTgt ? t.red : '#FFFFFF';
      x.lineWidth = isTgt ? 3 : 2;
      x.strokeRect(bx, by, d.w * sx, d.h * sy);
      const label = `${d.label} ${d.score < 1 ? d.score : ''}`.trim();
      const lw = x.measureText(label).width + 10;
      x.fillStyle = isTgt ? t.red : '#FFFFFF';
      x.fillRect(bx - (isTgt ? 1.5 : 1), by - 18, lw, 18);
      x.fillStyle = isTgt ? '#FFFFFF' : '#0B0B0F';
      x.fillText(label, bx + 4, by - 5);
    }
    // the stop size: once the red box grows past this outline the car is fully stopped
    const aw = Math.sqrt(safetyArea * 4 / 3) * w * 0.866, ah = aw * 0.75;
    x.strokeStyle = '#FFC847'; x.lineWidth = 2; x.setLineDash([7, 5]);
    x.strokeRect((w - aw) / 2, (h - ah) / 2, aw, ah);
    x.strokeStyle = '#FFFFFF'; x.lineWidth = 1; x.setLineDash([3, 5]);
    x.beginPath(); x.moveTo(w / 2, 0); x.lineTo(w / 2, h); x.stroke();
    x.setLineDash([]);
  }

  /* frames pulled one at a time, so a slow link drops frames instead of building a queue; paused while hidden */
  function frames(img, onEach) {
    (function loop() {
      if (document.hidden) { setTimeout(loop, 250); return; }
      const t = Date.now();
      const done = ev => {
        img.removeEventListener('load', done); img.removeEventListener('error', done);
        onEach(ev.type === 'load');
        setTimeout(loop, Math.max(20, 160 - (Date.now() - t)));
      };
      img.addEventListener('load', done); img.addEventListener('error', done);
      img.src = '/frame?' + t;
    })();
  }

  showTheme();
  return { post, toast, tokens, live, fitCanvas, stepper, hold, zoomable, fill, liveRange, drawLidar, drawSeries, drawCamera, frames };
})();

</script>
<script>
const POLL_MS = 3000;
// 20 polls: the last 60 s of each topic's rate
const HISTORY = 20;

// a node's status (dashboard.py) as a flag: absent is to check, whether the watchdog restarts it or not
const NODE = {
  healthy: { cls: 's-ok', label: 'Publishing' },
  dead: { cls: 's-caution', label: 'Not detected', note: 'Watchdog restarts it' },
  unsupervised: { cls: 's-caution', label: 'Not detected', note: 'No auto restart' },
  off: { cls: 's-off', label: 'Standby' },
};
// a health item's: no reading or out of band is to check; dead is a real fault (too hot, charge now)
const HEALTH = {
  healthy: { cls: 's-ok', label: 'OK' },
  stale: { cls: 's-caution', label: 'Check' },
  missing: { cls: 's-caution', label: 'Check' },
  dead: { cls: 's-fault', label: 'Fault' },
};

// The drive chain (the driver's drive stack): the RC through the gamepad node and autonomy's /drive, two ways in that
// meet at the mux, then the throttle and the ESP32. Each stage's area in the chain's grid.
const STAGES = [
  { area: 'rc', node: 'joy', name: 'FlySky RC' },
  { area: 'gp', node: 'gamepad', name: 'Gamepad' },
  { area: 'au', node: 'bridge', name: 'Autonomy' },
  { area: 'mux', node: 'mux', name: 'Mux' },
  { area: 'th', node: 'throttle', name: 'Throttle' },
  { area: 'esp', node: 'controller', name: 'ESP32' },
];
// each link: its area, the node that publishes it, its topic
const LINKS = [
  { area: 'l1', node: 'joy', topic: '/joy' },
  { area: 'lg', node: 'gamepad', topic: '/gamepad_drive' },
  { area: 'la', node: 'bridge', topic: '/drive' },
  { area: 'l3', node: 'mux', topic: '/mux_out' },
  { area: 'l4', node: 'throttle', topic: '/motor' },
];

const board = document.getElementById('board');
const history = {};
let latestGraph = null;

function hzOf(rates, topic) {
  const r = rates[topic];
  return r && r.hz !== null && !r.stale ? r.hz : null;
}

function hzText(hz) {
  return hz >= 100 ? hz.toFixed(0) + ' Hz' : hz.toFixed(1) + ' Hz';
}

function state(label) {
  return `<span class="state"><i aria-hidden="true"></i>${label}</span>`;
}

function tile(n, rates) {
  const s = NODE[n.status];
  const hz = hzOf(rates, n.topic);
  const [name, detail] = n.label.split(/ (?=\()/);
  return `<div class="tile ${s.cls}${s.note ? ' has-note' : ''}">
    <div class="top-row">${state(s.label)}${hz !== null ? `<span class="hz num">${hzText(hz)}</span>` : ''}</div>
    <div class="name" title="${n.label}">${name}${detail ? `<span class="detail"> ${detail.replace(/[_/]/g, '$&<wbr>')}</span>` : ''}</div>
    ${s.note ? `<div class="restart">${s.note}</div>` : ''}
    <div class="topic">${n.topic}</div>
  </div>`;
}

// a link is live while its node publishes and, where the server measures the topic, the topic arrives
function chain(nodes, rates) {
  let html = '';
  for (const st of STAGES) {
    const s = NODE[nodes[st.node].status];
    html += `<div class="stage ${s.cls}" style="grid-area: ${st.area}">${state(s.label)}<div class="name">${st.name}</div></div>`;
  }
  for (const l of LINKS) {
    const hz = hzOf(rates, l.topic);
    const up = nodes[l.node].status === 'healthy' && (hz !== null || !(l.topic in rates));
    html += `<div class="link ${l.area} ${up ? '' : 'down'}" style="grid-area: ${l.area}">
      <span class="t mono">${l.topic}</span><div class="wire"></div><b class="r num">${hz !== null ? hzText(hz) : (up ? 'Live' : 'No data')}</b></div>`;
  }
  return html;
}

// a health item's detail (dashboard.py): "48.2 C", "78.4 C - warm", "NO READING"; the battery's "12.6 V (100%)",
// "11.0 V (37%) - low", "NO READING - 20 s ago"
function gauge(el, item) {
  const s = HEALTH[item.status];
  const cut = item.detail.indexOf(' - ');
  const main = cut < 0 ? item.detail : item.detail.slice(0, cut);
  const note = cut < 0 ? '' : item.detail.slice(cut + 3);
  const pct = /^(.*) \((\d+)%\)$/.exec(main);
  const side = [pct ? pct[2] + '%' : '', note].filter(Boolean).join(' · ');
  const value = pct ? pct[1] : main;
  el.className = `gauge ${s.cls}`;
  el.hidden = false;
  el.innerHTML = `<div class="row"><span class="name">${item.label}</span>${state(s.label)}</div>
    <span class="value fit num" style="--len: ${value.length}">${value}</span>
    <span class="side num">${side}</span>
    ${pct ? `<div class="cells" aria-hidden="true">${Array.from({ length: 10 }, (_, k) => `<i class="${k < Math.round(pct[2] / 10) ? 'on' : ''}"></i>`).join('')}</div>` : ''}`;
}

function spark(values) {
  const W = 56, H = 18;
  const max = Math.max(1, ...values.map(v => v || 0));
  const step = W / (HISTORY - 1);
  const start = HISTORY - values.length;
  const pts = values.map((v, k) => `${((start + k) * step).toFixed(1)},${(H - 1 - ((v || 0) / max) * (H - 2)).toFixed(1)}`).join(' ');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

function render(data) {
  latestGraph = data.graph || null;
  const ts = document.getElementById('timestamp');
  ts.textContent = data.timestamp.slice(11);
  ts.title = data.timestamp;
  document.getElementById('log-dir').textContent = data.log_dir;

  const rates = data.rates;
  for (const [topic, info] of Object.entries(rates)) {
    const h = history[topic] || (history[topic] = []);
    h.push(info.hz);
    if (h.length > HISTORY) h.shift();
  }

  let core = '', autonomy = '', coreUp = 0, coreTotal = 0, autonomyUp = 0, autonomyTotal = 0;
  const coreTopics = new Set();
  for (const n of Object.values(data.nodes)) {
    if (n.optional) {
      autonomy += tile(n, rates);
      autonomyTotal += 1;
      if (n.alive) autonomyUp += 1;
    } else {
      core += tile(n, rates);
      coreTotal += 1;
      coreTopics.add(n.topic);
      if (n.alive) coreUp += 1;
    }
  }
  document.getElementById('nodes').innerHTML = core;
  document.getElementById('autonomy').innerHTML = autonomy;
  document.getElementById('drive-count').textContent = `${coreUp} of ${coreTotal} up`;
  const tag = document.getElementById('autonomy-tag');
  tag.textContent = autonomyUp === 0 ? 'Off' : (autonomyUp === autonomyTotal ? 'Running' : `${autonomyUp} of ${autonomyTotal} up`);
  tag.className = `tag ${autonomyUp > 0 ? 's-ok' : 's-off'}`;

  const health = Object.values(data.system_health);
  health.forEach((item, k) => gauge(document.getElementById(`health-${k}`), item));
  for (let k = health.length; k < 2; k++) document.getElementById(`health-${k}`).hidden = true;
  board.classList.toggle('one-health', health.length === 1);

  document.getElementById('chain').innerHTML = chain(data.nodes, rates);

  // a rate: OK, stale, or no data: to check on the drive stack's own topics, off on autonomy's
  let rh = '', live = 0;
  for (const [topic, info] of Object.entries(rates)) {
    const cls = info.hz === null ? (coreTopics.has(topic) ? 'caution' : 'off') : (info.stale ? 'caution' : 'ok');
    if (cls === 'ok') live += 1;
    const value = info.hz === null ? (cls === 'off' ? 'Off' : 'No data') : hzText(info.hz) + (info.stale ? ' stale' : '');
    rh += `<div class="rate s-${cls}"><div class="in"><span class="topic" title="${topic}">${topic}</span><span class="v num">${value}</span>${spark(history[topic])}</div></div>`;
  }
  document.getElementById('rates').innerHTML = rh;

  document.getElementById('stat-drive').textContent = `${coreUp}/${coreTotal}`;
  document.getElementById('stat-autonomy').textContent = autonomyUp === 0 ? 'Off' : `${autonomyUp}/${autonomyTotal}`;
  document.getElementById('stat-topics').textContent = `${live}/${Object.keys(rates).length}`;

  const wl = data.watchdog_log;
  document.getElementById('watchdog-log').textContent = wl.length ? wl.join('\n') : 'No watchdog events yet.';
}

function update() {
  fetch('/api/status')
    .then(r => {
      if (!r.ok) throw new Error(`the dashboard answered ${r.status}`);
      return r.json();
    })
    .then(data => {
      KIT.live.ok();  // (then the clock replaces its "Live")
      render(data);
    })
    .catch(err => {
      // what is below is the last update, greyed (main.lost); the bar says since when, and why on hover
      const ts = document.getElementById('timestamp');
      const at = ts.title;
      KIT.live.lost(err);
      ts.textContent = at ? `No answer · last ${at.slice(11)}` : 'No answer';
    });
}

update();
setInterval(update, POLL_MS);

/* ── Node graph: layered left-to-right layout, rqt_graph structure ── */
function short(name) {
  const parts = name.split('/').filter(Boolean);
  return parts.length ? parts[parts.length - 1] : name;
}

function layoutAndRender() {
  const svg = document.getElementById('graph-svg');
  const root = document.getElementById('graph-root');
  root.innerHTML = '';
  if (!latestGraph || !latestGraph.nodes.length) {
    root.innerHTML = '<text x="40" y="60" style="fill: var(--ink-2)" font-size="14">No graph yet.</text>';
    return;
  }

  const items = [];
  const index = new Map();
  latestGraph.nodes.forEach(n => { index.set(n, items.length); items.push({ id: n, kind: 'node' }); });
  latestGraph.topics.forEach(t => { index.set(t, items.length); items.push({ id: t, kind: 'topic' }); });
  const links = latestGraph.edges
    .filter(([a, b]) => index.has(a) && index.has(b))
    .map(([a, b]) => [index.get(a), index.get(b)]);

  const out = items.map(() => []);
  links.forEach(([a, b]) => out[a].push(b));

  // Layering like dot: longest path over the DAG after DFS cycle-breaking
  // (the drive pipeline is a real loop).
  const state = new Array(items.length).fill(0);
  const back = new Set();
  function dfs(u) {
    state[u] = 1;
    for (const v of out[u]) {
      if (state[v] === 1) back.add(u + '>' + v);
      else if (state[v] === 0) dfs(v);
    }
    state[u] = 2;
  }
  for (let i = 0; i < items.length; i++) if (state[i] === 0) dfs(i);
  const fwd = links.filter(([a, b]) => !back.has(a + '>' + b));

  const layer = new Array(items.length).fill(0);
  for (let pass = 0; pass < items.length; pass++) {
    let changed = false;
    for (const [a, b] of fwd) {
      if (layer[b] < layer[a] + 1) { layer[b] = layer[a] + 1; changed = true; }
    }
    if (!changed) break;
  }

  // Barycenter sweeps to reduce crossings.
  const nLayers = Math.max(...layer) + 1;
  const cols = Array.from({ length: nLayers }, () => []);
  items.forEach((it, i) => cols[layer[i]].push(i));
  const pos = new Array(items.length).fill(0);
  cols.forEach(col => col.forEach((id, k) => { pos[id] = k; }));
  const nbrs = items.map(() => []);
  links.forEach(([a, b]) => { nbrs[a].push(b); nbrs[b].push(a); });
  for (let sweep = 0; sweep < 4; sweep++) {
    for (const col of cols) {
      col.sort((x, y) => {
        const bx = nbrs[x].length ? nbrs[x].reduce((s2, n) => s2 + pos[n], 0) / nbrs[x].length : pos[x];
        const by = nbrs[y].length ? nbrs[y].reduce((s2, n) => s2 + pos[n], 0) / nbrs[y].length : pos[y];
        return bx - by;
      });
      col.forEach((id, k) => { pos[id] = k; });
    }
  }

  const PADX = 60, ROWH = 52, GAPX = 70;
  const widths = items.map(it => {
    const label = it.kind === 'node' ? short(it.id) : it.id;
    return Math.max(60, label.length * (it.kind === 'node' ? 7.6 : 6.8) + 30);
  });
  let x = PADX;
  const colX = [];
  cols.forEach((col, li) => {
    const w = Math.max(...col.map(id => widths[id]), 60);
    colX[li] = x + w / 2;
    x += w + GAPX;
  });
  const totalW = x + PADX;
  const maxRows = Math.max(...cols.map(c => c.length));
  const totalH = Math.max(maxRows * ROWH + 80, 420);
  svg.setAttribute('viewBox', `0 0 ${Math.max(totalW, svg.clientWidth)} ${totalH}`);
  items.forEach((it, i) => {
    it.w = widths[i];
    it.h = it.kind === 'node' ? 30 : 24;
    it.x = colX[layer[i]];
    const col = cols[layer[i]];
    it.y = totalH / 2 + (pos[i] - (col.length - 1) / 2) * ROWH;
  });

  const NS = 'http://www.w3.org/2000/svg';
  const edgeEls = [];
  for (const [ai, bi] of links) {
    const e = document.createElementNS(NS, 'path');
    e.setAttribute('class', 'gedge');
    e.setAttribute('marker-end', 'url(#arrow)');
    root.appendChild(e);
    edgeEls.push([e, ai, bi]);
  }
  const itemEls = [];
  items.forEach((it, i) => {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', it.kind === 'node' ? 'gnode' : 'gtopic');
    const label = it.kind === 'node' ? short(it.id) : it.id;
    const shape = document.createElementNS(NS, 'rect');
    shape.setAttribute('width', it.w);
    shape.setAttribute('height', it.h);
    shape.setAttribute('rx', it.kind === 'node' ? it.h / 2 : 4);
    const text = document.createElementNS(NS, 'text');
    text.textContent = label;
    text.setAttribute('x', it.w / 2); text.setAttribute('y', it.h / 2 + 4);
    text.setAttribute('text-anchor', 'middle');
    const title = document.createElementNS(NS, 'title');
    title.textContent = it.id;
    g.appendChild(shape); g.appendChild(text); g.appendChild(title);
    root.appendChild(g);
    itemEls.push(g);

    g.addEventListener('mouseenter', () => {
      const hot = new Set([i]);
      edgeEls.forEach(([e, a, b]) => {
        if (a === i || b === i) { e.classList.add('hot'); hot.add(a); hot.add(b); }
        else e.classList.add('dim');
      });
      itemEls.forEach((el, j) => { if (!hot.has(j)) el.classList.add('dim'); });
    });
    g.addEventListener('mouseleave', () => {
      edgeEls.forEach(([e]) => e.classList.remove('hot', 'dim'));
      itemEls.forEach(el => el.classList.remove('dim'));
    });

    g.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      g.setPointerCapture(ev.pointerId);
      const move = (mv) => {
        const pt = svg.createSVGPoint(); pt.x = mv.clientX; pt.y = mv.clientY;
        const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
        it.x = loc.x; it.y = loc.y;
        position();
      };
      const up = () => {
        g.removeEventListener('pointermove', move);
        g.removeEventListener('pointerup', up);
      };
      g.addEventListener('pointermove', move);
      g.addEventListener('pointerup', up);
    });
  });

  function position() {
    items.forEach((it, i) => {
      itemEls[i].setAttribute('transform',
        `translate(${it.x - it.w / 2}, ${it.y - it.h / 2})`);
    });
    edgeEls.forEach(([e, ai, bi]) => {
      const a = items[ai], b = items[bi];
      const leftToRight = a.x <= b.x;
      const x1 = leftToRight ? a.x + a.w / 2 : a.x - a.w / 2;
      const x2 = leftToRight ? b.x - b.w / 2 - 4 : b.x + b.w / 2 + 4;
      const mx = (x1 + x2) / 2;
      e.setAttribute('d', `M ${x1} ${a.y} C ${mx} ${a.y}, ${mx} ${b.y}, ${x2} ${b.y}`);
    });
  }
  position();
}

const overlay = document.getElementById('graph-overlay');
document.getElementById('graph-btn').addEventListener('click', () => {
  overlay.classList.add('open');
  requestAnimationFrame(layoutAndRender);
});
document.getElementById('graph-close').addEventListener('click', () => overlay.classList.remove('open'));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') overlay.classList.remove('open'); });
</script>
</body>
