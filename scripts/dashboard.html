  :root {
    /* Neobotics brand tokens (nb-tokens.ts) */
    --nb-red: #FF0033;
    --nb-red-dark: #CC0029;
    --nb-blue: #1B2036;
    --nb-blue-deep: #13172A;
    --nb-white: #FFFFFF;
    --line: rgba(27, 32, 54, 0.10);
    --line-soft: rgba(27, 32, 54, 0.07);
    --text: #1B2036;
    --text-muted: rgba(27, 32, 54, 0.66);
    --text-dim: rgba(27, 32, 54, 0.42);
    --ok: #1E9E5A;
    --warn: #B45309;
    --bad: #CC0029;
    --off: rgba(27, 32, 54, 0.38);
    --heading-font: 'Kernel', 'Space Grotesk', sans-serif;
    --body-font: 'Akzidenz-Grotesk BQ', 'Akzidenz-Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --mono-font: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --shadow-card: 0 4px 14px rgba(27, 32, 54, 0.08);
    --shadow-card-lg: 0 12px 32px rgba(27, 32, 54, 0.14);
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--body-font);
    background: var(--nb-white);
    color: var(--text);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100dvh;
  }
  /* Faint tarmac-blue washes; the page stays white, blue leads. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(700px 480px at 90% 0%,  rgba(27, 32, 54, 0.05), transparent 65%),
      radial-gradient(560px 420px at 0% 100%, rgba(27, 32, 54, 0.04), transparent 60%);
  }
  code, .mono, .hz, td.topic, .log-box {
    font-family: var(--mono-font);
    font-variant-numeric: tabular-nums;
  }

  /* ── Header: tarmac blue, red rule ─────────────────────────────── */
  header {
    background: var(--nb-blue);
    border-bottom: 2px solid var(--nb-red);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header img.logo { height: 26px; display: block; }
  header .divider { width: 1px; height: 24px; background: rgba(255,255,255,0.16); }
  header h1 {
    font-family: var(--heading-font);
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--nb-white);
  }
  header h1 .thin { font-weight: 400; color: rgba(255,255,255,0.72); }
  header .meta {
    margin-left: auto;
    color: rgba(255,255,255,0.72);
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: #37D67F;
    animation: pulse 2s ease-in-out infinite;
  }
  .pulse.err { background: var(--nb-red); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  .btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: var(--nb-white);
    font: inherit;
    font-size: 0.78rem;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: border-color 150ms ease-out, background 150ms ease-out;
  }
  .btn:hover, .btn:focus-visible { border-color: var(--nb-red); background: rgba(255, 0, 51, 0.18); }
  .btn:focus-visible { outline: 2px solid var(--nb-red); outline-offset: 2px; }
  .btn svg { display: block; }

  main { max-width: 1120px; margin: 0 auto; padding: 28px 24px 48px; }

  #error-banner {
    display: none;
    background: rgba(204, 0, 41, 0.08);
    border: 1px solid rgba(204, 0, 41, 0.35);
    color: var(--bad);
    padding: 10px 16px;
    border-radius: var(--radius);
    margin-bottom: 24px;
    font-size: 0.85rem;
  }

  /* ── Section titles with brand chips ───────────────────────────── */
  .section-title {
    font-family: var(--heading-font);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--nb-blue);
    margin: 34px 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title:first-of-type { margin-top: 0; }
  .section-title .glyph {
    width: 10px; height: 10px; border-radius: 3px;
    transform: rotate(45deg);
    flex-shrink: 0;
  }
  .section-title.s-drive .glyph    { background: var(--nb-red); }
  .section-title.s-autonomy .glyph { background: var(--nb-blue); }
  .section-title.s-health .glyph   { background: var(--ok); }
  .section-title.s-rates .glyph    { background: var(--warn); }
  .section-title.s-log .glyph      { background: var(--text-dim); }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .section-title .tag {
    font-size: 0.65rem;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--nb-white);
    border: 1px solid var(--line);
    color: var(--text-muted);
    letter-spacing: 0.08em;
  }
  .section-title .tag.on { background: rgba(30, 158, 90, 0.12); border-color: rgba(30, 158, 90, 0.4); color: var(--ok); }

  /* ── Glass cards ───────────────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
    gap: 14px;
  }
  .card {
    position: relative;
    background: var(--nb-white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 15px 16px 12px;
    box-shadow: var(--shadow-card);
    overflow: hidden;
    transition: box-shadow 200ms ease-out, transform 200ms ease-out;
  }
  .card:hover { box-shadow: var(--shadow-card-lg); transform: translateY(-1px); }
  @media (prefers-reduced-motion: reduce) { .card, .card:hover { transition: none; transform: none; } }
  /* Status ribbon across the top edge. */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--off);
  }
  .card.healthy::before      { background: linear-gradient(90deg, var(--ok), #37D67F); }
  .card.stale::before,
  .card.unsupervised::before { background: linear-gradient(90deg, var(--warn), #F0A828); }
  .card.dead::before         { background: linear-gradient(90deg, var(--nb-red-dark), var(--nb-red)); }
  .card.off::before          { background: rgba(27, 32, 54, 0.18); }
  .card.off { opacity: 0.72; }
  .card h2 {
    font-family: var(--heading-font);
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .accent {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .card .topic { color: var(--text-muted); font-size: 0.74rem; margin-top: 3px; }
  /* Quiet status footer: hairline divider, dot, small caps. */
  .card .state {
    margin-top: 11px;
    padding-top: 9px;
    border-top: 1px solid var(--line-soft);
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.66rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--text-muted);
  }
  .state.dead { color: var(--bad); }
  .state.off  { color: var(--text-dim); }
  .indicator {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--off);
    transition: background 300ms ease-out;
  }
  .state.healthy .indicator      { background: var(--ok); box-shadow: 0 0 0 3px rgba(30, 158, 90, 0.14); }
  .state.stale .indicator,
  .state.unsupervised .indicator { background: var(--warn); box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.12); }
  .state.dead .indicator         { background: var(--bad); box-shadow: 0 0 0 3px rgba(204, 0, 41, 0.14); }
  .state.off .indicator          { background: var(--off); }

  /* ── Rates table ───────────────────────────────────────────────── */
  .table-wrap {
    background: var(--nb-white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 16px; font-size: 0.82rem; }
  thead th {
    color: var(--text-muted);
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line);
  }
  tbody tr + tr td { border-top: 1px solid var(--line-soft); }
  td.topic { color: var(--text); }
  td.hz, th.hz { text-align: right; }
  .hz.ok    { color: var(--ok); font-weight: 700; }
  .hz.stale { color: var(--warn); font-weight: 700; }
  .hz.dead  { color: var(--bad); font-weight: 700; }
  .hz.off   { color: var(--text-dim); }

  /* ── Watchdog log: console block ───────────────────────────────── */
  .log-box {
    background: var(--nb-blue);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 14px 16px;
    font-size: 0.76rem;
    line-height: 1.6;
    max-height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    color: rgba(255, 255, 255, 0.72);
  }

  footer {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 24px 32px;
    color: var(--text-dim);
    font-size: 0.72rem;
  }

  /* ── Node graph overlay (frosted) ──────────────────────────────── */
  #graph-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.9);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    backdrop-filter: blur(18px) saturate(1.3);
    z-index: 100;
    flex-direction: column;
  }
  #graph-overlay.open { display: flex; }
  #graph-overlay .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    background: var(--nb-blue);
    border-bottom: 2px solid var(--nb-red);
  }
  #graph-overlay .bar h2 {
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--nb-white);
  }
  #graph-overlay .bar .legend {
    margin-left: auto;
    display: flex;
    gap: 16px;
    color: rgba(255,255,255,0.72);
    font-size: 0.72rem;
    align-items: center;
  }
  .legend .chip { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw-node { width: 16px; height: 11px; border-radius: 999px; background: var(--nb-blue); border: 1px solid rgba(255,255,255,0.5); }
  .legend .sw-topic { width: 14px; height: 10px; border-radius: 2px; background: var(--nb-white); border: 1px solid rgba(27,32,54,0.35); }
  #graph-svg { flex: 1; width: 100%; touch-action: none; }
  #graph-svg .gnode ellipse { fill: var(--nb-blue); stroke: var(--nb-blue-deep); stroke-width: 1.2; }
  #graph-svg .gnode text { fill: var(--nb-white); font-size: 11px; font-weight: 600; }
  #graph-svg .gtopic rect { fill: var(--nb-white); stroke: rgba(27, 32, 54, 0.3); stroke-width: 1; }
  #graph-svg .gtopic text { fill: var(--nb-blue); font-size: 10px; font-family: ui-monospace, Menlo, monospace; }
  #graph-svg .gedge { stroke: rgba(27, 32, 54, 0.32); stroke-width: 1.2; fill: none; }
  #graph-svg g.dim { opacity: 0.15; }
  #graph-svg .gedge.hot { stroke: var(--nb-red); stroke-width: 1.8; }
  #graph-svg .gedge.dim { opacity: 0.08; }
  #graph-svg .gnode, #graph-svg .gtopic { cursor: grab; }
</style>
</head>

  slam:       '#2563EB',
  bridge:     '#FF0033',
  model:      '#4F46E5',
  nav:        '#1E9E5A',
};

function card(key, n) {
  const accent = ACCENTS[key] || '#1B2036';
  return `<div class="card ${n.status}">
    <h2><span class="accent" style="background:${accent}" aria-hidden="true"></span>${n.label}</h2>
    <div class="topic">${n.topic}</div>
    <span class="state ${n.status}"><span class="indicator" aria-hidden="true"></span>${STATE_LABEL[n.status] || n.status.toUpperCase()}</span>
  </div>`;
}

let latestGraph = null;

function update() {
  fetch('/api/status')
    .then(r => r.json())
    .then(data => {
      document.getElementById('error-banner').style.display = 'none';
      document.getElementById('pulse').classList.remove('err');
      latestGraph = data.graph || null;
      document.getElementById('timestamp').textContent = data.timestamp;
      document.getElementById('log-dir').textContent = data.log_dir;

      let core = '', autonomy = '', autonomyUp = 0, autonomyTotal = 0;
      for (const [key, n] of Object.entries(data.nodes)) {
        if (n.optional) {
          autonomy += card(key, n);
          autonomyTotal += 1;
          if (n.alive) autonomyUp += 1;
        } else {
          core += card(key, n);
        }
      }
      document.getElementById('nodes').innerHTML = core;
      document.getElementById('autonomy').innerHTML = autonomy;
      const tag = document.getElementById('autonomy-tag');
      tag.textContent = autonomyUp === 0 ? 'OFF'
        : (autonomyUp === autonomyTotal ? 'RUNNING' : `${autonomyUp}/${autonomyTotal} UP`);
      tag.classList.toggle('on', autonomyUp > 0);

      let sh = '';
      for (const [key, item] of Object.entries(data.system_health || {})) {
        sh += `<div class="card ${item.status}">
          <h2><span class="accent" style="background:#1B2036" aria-hidden="true"></span>${item.label}</h2>
          <span class="state ${item.status}"><span class="indicator" aria-hidden="true"></span>${item.detail}</span>
        </div>`;
      }
      document.getElementById('system-health').innerHTML = sh;

      let rh = '';
      for (const [topic, info] of Object.entries(data.rates)) {
        const hz = info.hz !== null ? info.hz.toFixed(1) + ' Hz' : '&ndash;';
        const cls = info.hz === null ? 'off' : (info.stale ? 'stale' : 'ok');
        const label = info.hz === null ? 'NO DATA' : (info.stale ? 'STALE' : 'OK');
        rh += `<tr><td class="topic">${topic}</td><td class="hz ${cls}">${hz}</td><td class="hz ${cls}">${label}</td></tr>`;
      }
      document.getElementById('rates').innerHTML = rh;

      const wl = data.watchdog_log;
      document.getElementById('watchdog-log').textContent =
        wl.length ? wl.join('\n') : 'No watchdog events yet.';
    })
    .catch(err => {
      const banner = document.getElementById('error-banner');
      banner.textContent = 'Failed to fetch status: ' + err;
      banner.style.display = 'block';
      document.getElementById('pulse').classList.add('err');
    });
}

update();
setInterval(update, 3000);

/* ── Node graph: layered left-to-right layout, rqt_graph structure ── */
function short(name) {
  const parts = name.split('/').filter(Boolean);
  return parts.length ? parts[parts.length - 1] : name;
}

function layoutAndRender() {
  const svg = document.getElementById('graph-svg');
  const root = document.getElementById('graph-root');
  root.innerHTML = '';
  if (!latestGraph || !latestGraph.nodes.length) {
    root.innerHTML = '<text x="40" y="60" fill="rgba(27,32,54,0.6)" font-size="14">Graph not available yet.</text>';
    return;
  }

  const items = [];
  const index = new Map();
  latestGraph.nodes.forEach(n => { index.set(n, items.length); items.push({ id: n, kind: 'node' }); });
  latestGraph.topics.forEach(t => { index.set(t, items.length); items.push({ id: t, kind: 'topic' }); });
  const links = latestGraph.edges
    .filter(([a, b]) => index.has(a) && index.has(b))
    .map(([a, b]) => [index.get(a), index.get(b)]);

  const out = items.map(() => []);
  links.forEach(([a, b]) => out[a].push(b));

  // Layering like dot: longest path over the DAG after DFS cycle-breaking
  // (the drive pipeline is a real loop).
  const state = new Array(items.length).fill(0);
  const back = new Set();
  function dfs(u) {
    state[u] = 1;
    for (const v of out[u]) {
      if (state[v] === 1) back.add(u + '>' + v);
      else if (state[v] === 0) dfs(v);
    }
    state[u] = 2;
  }
  for (let i = 0; i < items.length; i++) if (state[i] === 0) dfs(i);
  const fwd = links.filter(([a, b]) => !back.has(a + '>' + b));

  const layer = new Array(items.length).fill(0);
  for (let pass = 0; pass < items.length; pass++) {
    let changed = false;
    for (const [a, b] of fwd) {
      if (layer[b] < layer[a] + 1) { layer[b] = layer[a] + 1; changed = true; }
    }
    if (!changed) break;
  }

  // Barycenter sweeps to reduce crossings.
  const nLayers = Math.max(...layer) + 1;
  const cols = Array.from({ length: nLayers }, () => []);
  items.forEach((it, i) => cols[layer[i]].push(i));
  const pos = new Array(items.length).fill(0);
  cols.forEach(col => col.forEach((id, k) => { pos[id] = k; }));
  const nbrs = items.map(() => []);
  links.forEach(([a, b]) => { nbrs[a].push(b); nbrs[b].push(a); });
  for (let sweep = 0; sweep < 4; sweep++) {
    for (const col of cols) {
      col.sort((x, y) => {
        const bx = nbrs[x].length ? nbrs[x].reduce((s2, n) => s2 + pos[n], 0) / nbrs[x].length : pos[x];
        const by = nbrs[y].length ? nbrs[y].reduce((s2, n) => s2 + pos[n], 0) / nbrs[y].length : pos[y];
        return bx - by;
      });
      col.forEach((id, k) => { pos[id] = k; });
    }
  }

  const PADX = 60, ROWH = 52, GAPX = 70;
  const widths = items.map(it => {
    const label = it.kind === 'node' ? short(it.id) : it.id;
    return Math.max(60, label.length * (it.kind === 'node' ? 7.4 : 6.4) + 26);
  });
  let x = PADX;
  const colX = [];
  cols.forEach((col, li) => {
    const w = Math.max(...col.map(id => widths[id]), 60);
    colX[li] = x + w / 2;
    x += w + GAPX;
  });
  const totalW = x + PADX;
  const maxRows = Math.max(...cols.map(c => c.length));
  const totalH = Math.max(maxRows * ROWH + 80, 420);
  svg.setAttribute('viewBox', `0 0 ${Math.max(totalW, svg.clientWidth)} ${totalH}`);
  items.forEach((it, i) => {
    it.w = widths[i];
    it.h = it.kind === 'node' ? 30 : 22;
    it.x = colX[layer[i]];
    const col = cols[layer[i]];
    it.y = totalH / 2 + (pos[i] - (col.length - 1) / 2) * ROWH;
  });

  const NS = 'http://www.w3.org/2000/svg';
  const edgeEls = [];
  for (const [ai, bi] of links) {
    const e = document.createElementNS(NS, 'path');
    e.setAttribute('class', 'gedge');
    e.setAttribute('marker-end', 'url(#arrow)');
    root.appendChild(e);
    edgeEls.push([e, ai, bi]);
  }
  const itemEls = [];
  items.forEach((it, i) => {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', it.kind === 'node' ? 'gnode' : 'gtopic');
    const label = it.kind === 'node' ? short(it.id) : it.id;
    let shape;
    if (it.kind === 'node') {
      shape = document.createElementNS(NS, 'ellipse');
      shape.setAttribute('cx', it.w / 2); shape.setAttribute('cy', it.h / 2);
      shape.setAttribute('rx', it.w / 2); shape.setAttribute('ry', it.h / 2);
    } else {
      shape = document.createElementNS(NS, 'rect');
      shape.setAttribute('width', it.w); shape.setAttribute('height', it.h);
      shape.setAttribute('rx', 2);
    }
    const text = document.createElementNS(NS, 'text');
    text.textContent = label;
    text.setAttribute('x', it.w / 2); text.setAttribute('y', it.h / 2 + 3.5);
    text.setAttribute('text-anchor', 'middle');
    const title = document.createElementNS(NS, 'title');
    title.textContent = it.id;
    g.appendChild(shape); g.appendChild(text); g.appendChild(title);
    root.appendChild(g);
    itemEls.push(g);

    g.addEventListener('mouseenter', () => {
      const hot = new Set([i]);
      edgeEls.forEach(([e, a, b]) => {
        if (a === i || b === i) { e.classList.add('hot'); hot.add(a); hot.add(b); }
        else e.classList.add('dim');
      });
      itemEls.forEach((el, j) => { if (!hot.has(j)) el.classList.add('dim'); });
    });
    g.addEventListener('mouseleave', () => {
      edgeEls.forEach(([e]) => e.classList.remove('hot', 'dim'));
      itemEls.forEach(el => el.classList.remove('dim'));
    });

    g.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      g.setPointerCapture(ev.pointerId);
      const move = (mv) => {
        const pt = svg.createSVGPoint(); pt.x = mv.clientX; pt.y = mv.clientY;
        const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
        it.x = loc.x; it.y = loc.y;
        position();
      };
      const up = () => {
        g.removeEventListener('pointermove', move);
        g.removeEventListener('pointerup', up);
      };
      g.addEventListener('pointermove', move);
      g.addEventListener('pointerup', up);
    });
  });

  function position() {
    items.forEach((it, i) => {
      itemEls[i].setAttribute('transform',
        `translate(${it.x - it.w / 2}, ${it.y - it.h / 2})`);
    });
    edgeEls.forEach(([e, ai, bi]) => {
      const a = items[ai], b = items[bi];
      const leftToRight = a.x <= b.x;
      const x1 = leftToRight ? a.x + a.w / 2 : a.x - a.w / 2;
      const x2 = leftToRight ? b.x - b.w / 2 - 4 : b.x + b.w / 2 + 4;
      const mx = (x1 + x2) / 2;
      e.setAttribute('d', `M ${x1} ${a.y} C ${mx} ${a.y}, ${mx} ${b.y}, ${x2} ${b.y}`);
    });
  }
  position();
}

const overlay = document.getElementById('graph-overlay');
document.getElementById('graph-btn').addEventListener('click', () => {
  overlay.classList.add('open');
  requestAnimationFrame(layoutAndRender);
});
document.getElementById('graph-close').addEventListener('click', () => overlay.classList.remove('open'));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') overlay.classList.remove('open'); });
</script>
</body>
</html>
