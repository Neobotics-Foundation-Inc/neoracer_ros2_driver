<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeoRacer Dashboard</title>
<style>
  :root {
    /* Neobotics brand tokens */
    --nb-red: #FF0033;
    --nb-blue: #1B2036;
    --nb-carbon: #1D1D27;
    --surface: #24242F;
    --surface-2: #2B2B38;
    --border: rgba(255, 255, 255, 0.08);
    --text: #F2F2F5;
    --text-muted: #A2A6B5;
    --ok: #2FBF71;
    --warn: #F0A828;
    --bad: #FF3355;
    --off: #6E7385;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--nb-carbon);
    color: var(--text);
    font-size: 16px;
    line-height: 1.5;
  }
  code, .mono, .hz, td.topic, .log-box {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* ── Header ─────────────────────────────────────────────────────── */
  header {
    background: var(--nb-blue);
    border-bottom: 2px solid var(--nb-red);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header img.logo { height: 26px; display: block; }
  header .divider { width: 1px; height: 24px; background: var(--border); }
  header h1 {
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text);
  }
  header .meta {
    margin-left: auto;
    color: var(--text-muted);
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok);
    animation: pulse 2s ease-in-out infinite;
  }
  .pulse.err { background: var(--bad); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  main { max-width: 1120px; margin: 0 auto; padding: 24px 24px 48px; }

  #error-banner {
    display: none;
    background: rgba(255, 51, 85, 0.12);
    border: 1px solid rgba(255, 51, 85, 0.4);
    color: var(--bad);
    padding: 10px 16px;
    border-radius: var(--radius);
    margin-bottom: 24px;
    font-size: 0.85rem;
  }

  /* ── Sections ───────────────────────────────────────────────────── */
  .section-title {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 32px 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .section-title .tag {
    font-size: 0.65rem;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    letter-spacing: 0.08em;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--off);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .card.healthy      { border-left-color: var(--ok); }
  .card.stale        { border-left-color: var(--warn); }
  .card.unsupervised { border-left-color: var(--warn); }
  .card.dead         { border-left-color: var(--bad); }
  .card.off          { border-left-color: var(--off); opacity: 0.75; }
  .card h2 {
    font-size: 0.9rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card .topic { color: var(--text-muted); font-size: 0.75rem; margin-top: 2px; }
  .card .state {
    margin-top: 8px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
  }
  .state.healthy      { color: var(--ok); }
  .state.stale        { color: var(--warn); }
  .state.unsupervised { color: var(--warn); }
  .state.dead         { color: var(--bad); }
  .state.off          { color: var(--off); }
  .indicator {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--off);
    flex-shrink: 0;
  }
  .indicator.healthy      { background: var(--ok); }
  .indicator.stale        { background: var(--warn); }
  .indicator.unsupervised { background: var(--warn); }
  .indicator.dead         { background: var(--bad); }

  /* ── Rates table ────────────────────────────────────────────────── */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 16px; font-size: 0.82rem; }
  thead th {
    color: var(--text-muted);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  tbody tr + tr td { border-top: 1px solid var(--border); }
  td.hz { text-align: right; }
  th.hz { text-align: right; }
  .hz.ok    { color: var(--ok); }
  .hz.stale { color: var(--warn); }
  .hz.dead  { color: var(--bad); }
  .hz.off   { color: var(--off); }

  /* ── Watchdog log ───────────────────────────────────────────────── */
  .log-box {
    background: #15151D;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 0.76rem;
    line-height: 1.6;
    max-height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    color: var(--text-muted);
  }

  /* ── Node graph overlay ─────────────────────────────────────────── */
  .btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font: inherit;
    font-size: 0.78rem;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: border-color 150ms ease-out, background 150ms ease-out;
  }
  .btn:hover, .btn:focus-visible { border-color: var(--nb-red); background: rgba(255,0,51,0.08); }
  .btn:focus-visible { outline: 2px solid var(--nb-red); outline-offset: 2px; }
  .btn svg { display: block; }

  #graph-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 28, 0.96);
    z-index: 100;
    flex-direction: column;
  }
  #graph-overlay.open { display: flex; }
  #graph-overlay .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    background: var(--nb-blue);
    border-bottom: 2px solid var(--nb-red);
  }
  #graph-overlay .bar h2 {
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  #graph-overlay .bar .legend {
    margin-left: auto;
    display: flex;
    gap: 16px;
    color: var(--text-muted);
    font-size: 0.72rem;
    align-items: center;
  }
  .legend .chip { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw-node { width: 14px; height: 10px; border-radius: 3px; background: var(--nb-blue); border: 1px solid #4A5470; }
  .legend .sw-topic { width: 14px; height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); }
  #graph-svg { flex: 1; width: 100%; touch-action: none; }
  #graph-svg .gnode rect { fill: var(--nb-blue); stroke: #4A5470; stroke-width: 1; rx: 6; }
  #graph-svg .gnode text { fill: var(--text); font-size: 11px; font-weight: 600; }
  #graph-svg .gtopic rect { fill: var(--surface-2); stroke: rgba(255,255,255,0.14); stroke-width: 1; }
  #graph-svg .gtopic text { fill: var(--text-muted); font-size: 10px; font-family: ui-monospace, Menlo, monospace; }
  #graph-svg .gedge { stroke: rgba(255,255,255,0.22); stroke-width: 1.2; fill: none; }
  #graph-svg g.dim { opacity: 0.15; }
  #graph-svg .gedge.hot { stroke: var(--nb-red); stroke-width: 1.8; }
  #graph-svg .gedge.dim { opacity: 0.08; }
  #graph-svg .gnode, #graph-svg .gtopic { cursor: grab; }

  footer {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 24px 32px;
    color: var(--text-muted);
    font-size: 0.72rem;
  }
</style>
</head>

<script>
const STATE_LABEL = {
  healthy: 'PUBLISHING',
  dead: 'NOT DETECTED',
  unsupervised: 'NOT DETECTED · NO AUTO-RESTART',
  off: 'OFF',
  stale: 'STALE',
};

function card(n) {
  return `<div class="card ${n.status}">
    <h2><span class="indicator ${n.status}"></span>${n.label}</h2>
    <div class="topic">${n.topic}</div>
    <div class="state ${n.status}">${STATE_LABEL[n.status] || n.status.toUpperCase()}</div>
  </div>`;
}

function update() {
  fetch('/api/status')
    .then(r => r.json())
    .then(data => {
      document.getElementById('error-banner').style.display = 'none';
      document.getElementById('pulse').classList.remove('err');
      latestGraph = data.graph || null;
      document.getElementById('timestamp').textContent = data.timestamp;
      document.getElementById('log-dir').textContent = data.log_dir;

      let core = '', autonomy = '', autonomyUp = 0, autonomyTotal = 0;
      for (const n of Object.values(data.nodes)) {
        if (n.optional) {
          autonomy += card(n);
          autonomyTotal += 1;
          if (n.alive) autonomyUp += 1;
        } else {
          core += card(n);
        }
      }
      document.getElementById('nodes').innerHTML = core;
      document.getElementById('autonomy').innerHTML = autonomy;
      const tag = document.getElementById('autonomy-tag');
      tag.textContent = autonomyUp === 0 ? 'OFF'
        : (autonomyUp === autonomyTotal ? 'RUNNING' : `${autonomyUp}/${autonomyTotal} UP`);

      let sh = '';
      for (const item of Object.values(data.system_health || {})) {
        sh += `<div class="card ${item.status}">
          <h2><span class="indicator ${item.status}"></span>${item.label}</h2>
          <div class="state ${item.status}">${item.detail}</div>
        </div>`;
      }
      document.getElementById('system-health').innerHTML = sh;

      let rh = '';
      for (const [topic, info] of Object.entries(data.rates)) {
        const hz = info.hz !== null ? info.hz.toFixed(1) + ' Hz' : '&ndash;';
        const cls = info.hz === null ? 'off' : (info.stale ? 'stale' : 'ok');
        const label = info.hz === null ? 'NO DATA' : (info.stale ? 'STALE' : 'OK');
        rh += `<tr><td class="topic">${topic}</td><td class="hz ${cls}">${hz}</td><td class="hz ${cls}">${label}</td></tr>`;
      }
      document.getElementById('rates').innerHTML = rh;

      const wl = data.watchdog_log;
      document.getElementById('watchdog-log').textContent =
        wl.length ? wl.join('\n') : 'No watchdog events yet.';
    })
    .catch(err => {
      const banner = document.getElementById('error-banner');
      banner.textContent = 'Failed to fetch status: ' + err;
      banner.style.display = 'block';
      document.getElementById('pulse').classList.add('err');
    });
}

update();
setInterval(update, 3000);

/* ── Node graph: force layout over the live pub/sub graph ─────────── */
let latestGraph = null;

function short(name) {
  const parts = name.split('/').filter(Boolean);
  return parts.length ? parts[parts.length - 1] : name;
}

function layoutAndRender() {
  const svg = document.getElementById('graph-svg');
  const root = document.getElementById('graph-root');
  root.innerHTML = '';
  if (!latestGraph || !latestGraph.nodes.length) {
    root.innerHTML = '<text x="40" y="60" fill="#A2A6B5" font-size="14">Graph not available yet.</text>';
    return;
  }
  const W = svg.clientWidth, H = svg.clientHeight;
  const items = [];
  const index = new Map();
  latestGraph.nodes.forEach(n => { index.set(n, items.length); items.push({ id: n, kind: 'node' }); });
  latestGraph.topics.forEach(t => { index.set(t, items.length); items.push({ id: t, kind: 'topic' }); });
  const links = latestGraph.edges
    .filter(([a, b]) => index.has(a) && index.has(b))
    .map(([a, b]) => [index.get(a), index.get(b)]);

  // Deterministic starting ring (no Math.random: stable between opens).
  items.forEach((it, i) => {
    const a = (i / items.length) * 2 * Math.PI;
    it.x = W / 2 + Math.cos(a) * Math.min(W, H) * 0.33;
    it.y = H / 2 + Math.sin(a) * Math.min(W, H) * 0.33;
  });

  // Small synchronous force sim: repulsion + springs + centering.
  for (let iter = 0; iter < 260; iter++) {
    const k = 1 - iter / 260;
    for (let i = 0; i < items.length; i++) {
      for (let j = i + 1; j < items.length; j++) {
        const a = items[i], b = items[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d2 = dx * dx + dy * dy + 0.01;
        if (d2 < 260 * 260) {
          const f = (9000 * k) / d2;
          const d = Math.sqrt(d2);
          dx /= d; dy /= d;
          a.x += dx * f; a.y += dy * f;
          b.x -= dx * f; b.y -= dy * f;
        }
      }
    }
    for (const [ai, bi] of links) {
      const a = items[ai], b = items[bi];
      let dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) + 0.01;
      const f = (d - 130) * 0.02 * k;
      dx /= d; dy /= d;
      a.x += dx * f * d * 0.02; a.y += dy * f * d * 0.02;
      b.x -= dx * f * d * 0.02; b.y -= dy * f * d * 0.02;
    }
    for (const it of items) {
      it.x += (W / 2 - it.x) * 0.004;
      it.y += (H / 2 - it.y) * 0.004;
      it.x = Math.max(70, Math.min(W - 70, it.x));
      it.y = Math.max(40, Math.min(H - 30, it.y));
    }
  }

  const NS = 'http://www.w3.org/2000/svg';
  const edgeEls = [];
  for (const [ai, bi] of links) {
    const e = document.createElementNS(NS, 'path');
    e.setAttribute('class', 'gedge');
    e.setAttribute('marker-end', 'url(#arrow)');
    root.appendChild(e);
    edgeEls.push([e, ai, bi]);
  }
  const itemEls = [];
  items.forEach((it, i) => {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', it.kind === 'node' ? 'gnode' : 'gtopic');
    const label = it.kind === 'node' ? short(it.id) : it.id;
    const w = Math.max(46, label.length * (it.kind === 'node' ? 7.2 : 6.2) + 18);
    const h = it.kind === 'node' ? 26 : 20;
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('width', w); rect.setAttribute('height', h);
    rect.setAttribute('rx', it.kind === 'node' ? 6 : 10);
    const text = document.createElementNS(NS, 'text');
    text.textContent = label;
    text.setAttribute('x', w / 2); text.setAttribute('y', h / 2 + 3.5);
    text.setAttribute('text-anchor', 'middle');
    const title = document.createElementNS(NS, 'title');
    title.textContent = it.id;
    g.appendChild(rect); g.appendChild(text); g.appendChild(title);
    root.appendChild(g);
    it.w = w; it.h = h;
    itemEls.push(g);

    g.addEventListener('mouseenter', () => {
      const hot = new Set([i]);
      edgeEls.forEach(([e, a, b]) => {
        if (a === i || b === i) { e.classList.add('hot'); hot.add(a); hot.add(b); }
        else e.classList.add('dim');
      });
      itemEls.forEach((el, j) => { if (!hot.has(j)) el.classList.add('dim'); });
    });
    g.addEventListener('mouseleave', () => {
      edgeEls.forEach(([e]) => e.classList.remove('hot', 'dim'));
      itemEls.forEach(el => el.classList.remove('dim'));
    });

    // Drag to arrange.
    g.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      g.setPointerCapture(ev.pointerId);
      const move = (mv) => {
        const pt = svg.createSVGPoint(); pt.x = mv.clientX; pt.y = mv.clientY;
        const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
        it.x = loc.x; it.y = loc.y;
        position();
      };
      const up = () => {
        g.removeEventListener('pointermove', move);
        g.removeEventListener('pointerup', up);
      };
      g.addEventListener('pointermove', move);
      g.addEventListener('pointerup', up);
    });
  });

  function position() {
    items.forEach((it, i) => {
      itemEls[i].setAttribute('transform',
        `translate(${it.x - it.w / 2}, ${it.y - it.h / 2})`);
    });
    edgeEls.forEach(([e, ai, bi]) => {
      const a = items[ai], b = items[bi];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const dx = b.x - a.x, dy = b.y - a.y;
      const bend = 0.12;
      const cx = mx - dy * bend, cy = my + dx * bend;
      e.setAttribute('d', `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`);
    });
  }
  position();
}

const overlay = document.getElementById('graph-overlay');
document.getElementById('graph-btn').addEventListener('click', () => {
  overlay.classList.add('open');
  requestAnimationFrame(layoutAndRender);
});
document.getElementById('graph-close').addEventListener('click', () => overlay.classList.remove('open'));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') overlay.classList.remove('open'); });
</script>
</body>
