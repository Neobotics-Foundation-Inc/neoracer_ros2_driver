<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeoRacer</title>
<link rel="icon" href="/ui/brand/n-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/neoracer.css?v=2">
<script src="/ui/theme.js?v=2"></script>
<style>
  /* This page only: the app tiles, the sections that fold, and the status views. */
  /* An app is a square in its state's color, like a status box: Running green,
     Starting yellow, Failed red. A stopped app is glass. */
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 24px 16px; }
  .app { appearance: none; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 0;
    color: var(--nr-ink); font: inherit; cursor: pointer; text-shadow: inherit; }
  .app .glyph { width: 76px; height: 76px; border-radius: 20px; display: grid; place-items: center; background: var(--nr-glass-card);
    border: 1px solid var(--nr-glass-edge); color: var(--nr-red); transition: box-shadow 120ms ease; }
  .app .glyph .nr-icon { width: 34px; height: 34px; }
  .app .name { font: 700 13px/17px var(--nr-font-title); letter-spacing: 0.04em; text-transform: uppercase; text-align: center; }
  .app .port { font-size: 12px; color: var(--nr-ink-2); font-variant-numeric: tabular-nums; }
  .app.on .glyph { background: var(--nr-ok); border-color: var(--nr-ok); color: var(--nr-ink-on-ok); }
  .app.starting .glyph { background: var(--nr-warn); border-color: var(--nr-warn); color: var(--nr-ink-on-warn); }
  .app.err .glyph { background: var(--nr-red); border-color: var(--nr-red); color: var(--nr-ink-on-red); }
  .app:hover .glyph, .app:focus-visible .glyph { box-shadow: 0 0 0 3px var(--nr-red); }
  .app:focus-visible { outline: none; }
  .app.unavailable { cursor: default; }
  .app.unavailable .glyph { border-style: dashed; color: var(--nr-ink-3); }
  .app.unavailable:hover .glyph { box-shadow: none; }
  .group-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
  /* A section that folds: its title is the panel title, the chevron turns when open. */
  details.nr-panel > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  details.nr-panel > summary::-webkit-details-marker { display: none; }
  details.nr-panel > summary .nr-icon { color: var(--nr-ink-2); transition: transform 150ms ease; }
  details.nr-panel[open] > summary .nr-icon { transform: rotate(180deg); }
  #system > .nr-seg { align-self: flex-start; margin-bottom: 8px; }
  .section { display: flex; flex-direction: column; gap: 12px; }
  .section > .nr-eyebrow:not(:first-child), .section > .nr-sub:not(:first-child) { margin-top: 12px; }
  /* Node names such as Mux (arbitrator) break between words, in boxes wide enough for them. */
  #advanced .nr-nodes { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  #system .nr-status .name { overflow-wrap: break-word; }
  .nr-status .line { font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
  .nr-status .line.mono { font-family: var(--nr-font-mono); font-size: 12px; }
  #autosheet { background: var(--nr-surface); color: var(--nr-ink); border: 1px solid var(--nr-edge); border-radius: var(--nr-radius-card);
    padding: 20px 24px; max-width: 420px; margin: auto; }
  #autosheet::backdrop { background: rgb(0 0 0 / 0.55); }
  #autosheet h2 { font-size: 18px; margin-bottom: 16px; }
  #msg:empty { display: none; }
  .foot { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  @media (prefers-reduced-motion: reduce) { .app .glyph, details.nr-panel > summary .nr-icon { transition: none; } }
  /* On a phone the badge, System Health and the theme buttons wrap onto a second row instead of running off the screen. */
  @media (max-width: 700px) { .nr-header .nr-meta { flex: 1 1 auto; flex-wrap: wrap; justify-content: flex-end; row-gap: 8px; } }
  /* On a narrow phone a box's value goes under its name, so the name does not break inside a word. */
  @media (max-width: 400px) {
    #basic .nr-status .top { flex-wrap: wrap; row-gap: 2px; }
    #basic .nr-status .name { flex: 1 0 auto; overflow-wrap: normal; }
  }
</style>
</head>
<body>
<header class="nr-header">
  <a class="nr-logo" href="/" aria-label="NeoRacer, the apps page">
    <img class="for-dark" src="/ui/brand/neoracer-logo-reversed.svg" alt="">
    <img class="for-light" src="/ui/brand/neoracer-logo.svg" alt="">
  </a>
  <span class="nr-divider"></span>
  <h1 class="nr-title">Apps <span class="thin" id="host"></span></h1>
  <div class="nr-meta">
    <span class="nr-badge off" id="overall">Loading</span>
    <span class="nr-live wait" id="live" title="The page asks the car for its status every 3 seconds, and the square blinks at each answer. No answer means the car missed two requests in a row, so the page may be out of date."><i></i><span>Waiting</span></span>
    <a class="nr-btn small" href="/health">System Health</a>
    <div class="nr-seg" role="group" aria-label="Theme">
      <button type="button" data-theme-pick="dark">Dark</button>
      <button type="button" data-theme-pick="light">Light</button>
    </div>
  </div>
</header>

<main class="nr-main" id="main">
  <section class="nr-panel" aria-labelledby="t-apps" id="apps-panel">
    <div class="nr-head"><h2 class="nr-panel-title" id="t-apps">Apps</h2></div>
    <div class="group-row"><div class="nr-eyebrow">Core</div></div>
    <div class="apps" id="apps-core"></div>
    <div class="group-row">
      <div class="nr-eyebrow">Lab dashboards</div>
      <button type="button" class="nr-btn quiet small" id="clear-apps"><svg class="nr-icon" aria-hidden="true"><use href="/ui/icons.svg#stop"/></svg>Clear apps</button>
    </div>
    <div class="apps" id="apps-apps"></div>
    <p class="nr-note" id="msg" role="status" aria-live="polite"></p>
  </section>

  <details class="nr-panel" id="features-section">
    <summary><h2 class="nr-panel-title">Features</h2><svg class="nr-icon" aria-hidden="true"><use href="/ui/icons.svg#chevron-down"/></svg></summary>
    <div class="apps" id="features"></div>
  </details>

  <dialog id="autosheet">
    <h2 id="autosheet-title">Save the map before stopping?</h2>
    <div class="nr-actions">
      <button type="button" class="nr-btn primary small" data-act="save-stop">Save and stop</button>
      <button type="button" class="nr-btn quiet small" data-act="stop">Stop without saving</button>
      <button type="button" class="nr-btn quiet small" data-act="">Cancel</button>
    </div>
  </dialog>

  <details class="nr-panel" id="system">
    <summary><h2 class="nr-panel-title">System status</h2><svg class="nr-icon" aria-hidden="true"><use href="/ui/icons.svg#chevron-down"/></svg></summary>
    <div class="nr-seg" role="group" aria-label="View">
      <button type="button" id="view-basic" aria-pressed="true">Basic</button>
      <button type="button" id="view-advanced" aria-pressed="false">Advanced</button>
    </div>
    <div class="section" id="basic">
      <div class="nr-eyebrow">Battery</div><div class="nr-nodes" id="chips-battery"></div>
      <div class="nr-eyebrow">Sensors</div><div class="nr-nodes" id="chips-sensors"></div>
      <div class="nr-eyebrow">Compute</div><div class="nr-nodes" id="chips-compute"></div>
      <div class="nr-eyebrow">Actuation</div><div class="nr-nodes" id="chips-actuation"></div>
      <div class="nr-eyebrow">Autonomy</div><div class="nr-nodes" id="chips-autonomy"></div>
    </div>
    <div class="section" id="advanced" hidden>
      <h3 class="nr-sub">Autonomy</h3><div class="nr-nodes" id="autonomy"></div>
      <h3 class="nr-sub">Nodes</h3><div class="nr-nodes" id="nodes"></div>
      <h3 class="nr-sub">Health</h3><div class="nr-nodes" id="system-health"></div>
      <h3 class="nr-sub">Topic rates</h3>
      <div class="nr-scrollx"><table class="nr-table"><thead><tr><th>Topic</th><th>Rate</th><th>Status</th></tr></thead><tbody id="rates"></tbody></table></div>
      <div class="nr-head"><h3 class="nr-sub">Watchdog log</h3><button type="button" class="nr-btn quiet small" id="clear-log">Clear log</button></div>
      <pre class="nr-code" id="watchdog-log">No watchdog events yet.</pre>
      <p class="nr-note">Logs: <span class="nr-mono" id="log-dir"></span></p>
    </div>
  </details>

  <div class="foot">
    <button type="button" class="nr-btn quiet small" id="refresh"><svg class="nr-icon" aria-hidden="true"><use href="/ui/icons.svg#refresh"/></svg>Refresh</button>
    <span class="nr-small nr-muted" id="timestamp"></span>
  </div>
</main>

<script>
'use strict';
const POLL_MS = 3000;
const MISSES = 2;                     // missed polls before the page says it lost the car
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const icon = (name) => `<svg class="nr-icon" aria-hidden="true"><use href="/ui/icons.svg#${esc(name)}"/></svg>`;
const num = (v, d = 0) => Number(v).toFixed(d);
const store = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (err) { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (err) { /* not remembered */ } },
};

// Redrawn every 3 s: touch the DOM only when the markup changes.
const shown = new Map();
function setHtml(id, html) { if (shown.get(id) !== html) { shown.set(id, html); $(id).innerHTML = html; } }

// One box in the one grammar, as on System Health: its name, its value top
// right, a word only for a problem, the detail lines under it.
function box(state, name, value, unit, word, title, lines = []) {
  const sr = { ok: 'Running', warn: 'Check', err: 'Fault', off: 'Off' }[state];
  return `<div class="nr-status ${state}"${title ? ` title="${esc(title)}"` : ''}>
    <div class="top"><span class="name">${esc(name)}</span>${value === null ? '' : `<span class="value">${esc(value)}${unit ? `<small>${esc(unit)}</small>` : ''}</span>`}</div>
    ${word ? `<span class="nr-word">${esc(word)}</span>` : ''}${lines.map(([text, cls]) => `<span class="line${cls ? ` ${cls}` : ''}">${esc(text)}</span>`).join('')}<span class="nr-sr">${sr}${word ? `: ${esc(word)}` : ''}</span></div>`;
}
// Node cards: absent is not detected (Check), a subsystem launched off is Off.
const NODE_LOOK = { healthy: ['ok', ''], off: ['off', ''], stale: ['warn', 'No data'], dead: ['warn', 'Not detected'], unsupervised: ['warn', 'Not detected'] };
// Health cards: Fault only for a real fault (HOT, CHARGE NOW, the data root missing).
const HEALTH_LOOK = { healthy: 'ok', stale: 'warn', dead: 'err', off: 'off' };
const AUTONOMY_LOOK = { healthy: ['ok', ''], stale: ['warn', 'Not localized'], dead: ['warn', 'No status'], off: ['off', ''] };
const hzOf = (r) => (r && r.hz !== null && r.hz !== undefined ? r.hz : null);
const hzText = (hz) => (hz === null ? null : num(hz, hz < 10 ? 1 : 0));

// -- apps --
let apps = [];
// systemctl state -> [tile class, problem word, state for a screen reader]
const APP_STATE = {
  active: ['on', '', 'Running'],
  activating: ['starting', 'Starting', 'Starting'],
  failed: ['err', 'Failed', 'Failed'],
  unavailable: ['unavailable', '', 'Not available'],
};
// Camera and detections change by restarting teleop, so their in-between
// state reads Restarting, whether the change turns them on or off.
const RESTARTING = ['starting', 'Restarting', 'Restarting'];
function tile(attr, item, state, port) {
  const look = state === 'activating' && item.restarts ? RESTARTING : APP_STATE[state];
  const [cls, word, sr] = look || ['', '', item.off || 'Stopped'];
  const said = state === 'active' && item.on ? item.on : sr;
  return `<button type="button" class="app ${cls}" ${attr}="${esc(item.id)}" title="${esc(item.desc)}"
      aria-label="${esc(`${item.name}${port ? `, port ${port}` : ''}, ${said.toLowerCase()}. ${item.desc}`)}">
    <span class="glyph">${icon(item.icon)}</span><span class="name">${esc(item.name)}</span>
    ${port ? `<span class="port">${port}</span>` : ''}${word ? `<span class="nr-word">${word}</span>` : ''}</button>`;
}
function renderApps() {
  for (const group of ['core', 'apps']) {
    setHtml(`apps-${group}`, apps.filter((a) => a.group === group).map((a) => tile('data-id', a, a.state, a.port)).join(''));
  }
}
const live = (a) => a.state === 'active' || a.state === 'activating';
// What an app's `needs` turns on, and how the page asks first.
const NEED = {
  camera: { feature: 'camera', ask: 'needs the camera. Turn it on?' },
  inference: { feature: 'detections', ask: 'needs detections. Turn them on?' },
};
$('apps-panel').addEventListener('click', (e) => {
  const el = e.target.closest('.app');
  if (!el || !el.dataset.id) return;
  const app = apps.find((a) => a.id === el.dataset.id);
  if (!app || app.state === 'unavailable') return;
  const other = apps.find((a) => a.exclusive && a.id !== app.id && live(a));
  if (app.exclusive && other && !live(app)
      && !confirm(`${other.name} is open. Close it and open ${app.name}?`)) return;
  const auto = features.find((f) => f.id === 'autonomy');
  if (app.exclusive && !live(app) && auto && live(auto)) {
    const last = auto.last || {};
    const ask = last.mode === 'mapping'
      ? `Mapping ${last.map} is running. Save it, stop it, and open ${app.name}?`
      : `Localizing on ${last.map || 'a map'}. Stop it and open ${app.name}?`;
    if (!confirm(ask)) return;
  }
  const need = NEED[app.needs];
  const turnOn = need && !live(app) && featureState(need.feature) === 'inactive';
  if (turnOn && !confirm(`${app.name} ${need.ask}\n\n${RESTART}`)) return;
  // Opened from the click so the browser allows the new tab.
  window.open(`/launch?app=${encodeURIComponent(app.id)}`, '_blank');
  if (turnOn) setFeature({ feature: need.feature, on: true });
});

// -- features: camera and detections restart teleop; autonomy is its own service --
const RESTART = 'Teleop restarts. Driving and the sensors pause for about 15 seconds.';
let features = [];
let featureMessage = '';
function featureState(id) { return (features.find((f) => f.id === id) || {}).state; }
function renderFeatures(view) {
  if (!view) return;
  features = view.items;
  setHtml('features', features.map((f) => tile('data-feature', { ...f, on: 'On', off: 'Off', restarts: f.id !== 'autonomy' }, f.state, null)).join(''));
  const job = view.job || {};
  if (job.message && job.message !== featureMessage) $('msg').textContent = job.message;
  featureMessage = job.message || '';
}
async function setFeature(body) {
  try {
    const r = await (await fetch('/api/feature', { method: 'POST', body: JSON.stringify(body) })).json();
    $('msg').textContent = r.message;
    featureMessage = r.message;
  } catch (err) { $('msg').textContent = 'Lost contact with the car.'; }
  update(false);
}
function mapviewUrl() {
  const port = (apps.find((a) => a.id === 'mapview') || {}).port;
  return `${location.protocol}//${location.hostname}:${port}/`;
}
function autonomyClick(f) {
  const last = f.last || {};
  if (!live(f)) {
    if (!last.map) { window.open(mapviewUrl(), '_blank'); return; }
    let ask = last.mode === 'mapping' ? `Continue mapping ${last.map}?` : `Localize on ${last.map} again?`;
    const driving = apps.filter((a) => a.exclusive && live(a)).map((a) => a.name);
    if (driving.length) ask += ` ${driving.join(' and ')} will close.`;
    if (confirm(ask)) setFeature({ feature: 'autonomy', action: 'resume' });
    return;
  }
  if (last.mode === 'mapping') {
    $('autosheet-title').textContent = `Save ${last.map} before stopping?`;
    $('autosheet').showModal();
  } else if (confirm(`Stop localizing on ${last.map || 'the map'}?`)) {
    setFeature({ feature: 'autonomy', action: 'stop' });
  }
}
$('autosheet').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  $('autosheet').close();
  if (b.dataset.act) setFeature({ feature: 'autonomy', action: b.dataset.act });
});
$('features').addEventListener('click', (e) => {
  const el = e.target.closest('[data-feature]');
  const f = el && features.find((x) => x.id === el.dataset.feature);
  if (!f || f.state === 'activating') return;
  if (f.id === 'autonomy') { autonomyClick(f); return; }
  const on = f.state !== 'active';
  let ask = `Turn ${on ? 'on' : 'off'} ${f.name.toLowerCase()}?`;
  if (on && f.id === 'detections' && featureState('camera') !== 'active') ask = 'Turn on detections and the camera?';
  if (!on) {
    if (f.id === 'camera' && featureState('detections') === 'active') ask = 'Turn off the camera and detections?';
    // Detections need the camera, so turning the camera off ends both.
    const lost = f.id === 'camera' ? ['camera', 'inference'] : ['inference'];
    const users = apps.filter((a) => lost.includes(a.needs) && live(a)).map((a) => a.name);
    if (users.length) ask += ` ${users.join(' and ')} will have no ${f.name.toLowerCase()}.`;
  }
  if (confirm(`${ask}\n\n${RESTART}`)) setFeature({ feature: f.id, on });
});

// -- system status --
// [kind, key, name, group]; kind picks where the status comes from.
const INDICATORS = [
  ['node', 'controller', 'ESP32', 'sensors'],
  ['node', 'odom', 'Odometry', 'sensors'],
  ['node', 'joy', 'RC', 'sensors'],
  ['node', 'lidar', 'Lidar', 'sensors'],
  ['node', 'camera', 'Camera', 'sensors'],
  ['node', 'gamepad', 'Gamepad', 'sensors'],
  ['node', 'inference', 'Inference', 'compute'],
  ['health', 'data', 'Data', 'compute'],
  ['health', 'temperature', 'Junction', 'compute'],
  ['health', 'throttling', 'Throttling', 'compute'],
  ['node', 'throttle', 'Throttle', 'actuation'],
  ['node', 'mux', 'Mux', 'actuation'],
  ['autonomy', 'autonomy', 'Autonomy', 'autonomy'],
];
// The 3S pack from the server's battery reading: ok, low, charge (below 10.8 V) or stale.
function batteryBox(b) {
  if (!b) return box('warn', 'Battery', null, '', 'No reading');
  const look = { ok: ['ok', ''], low: ['warn', 'Low'], charge: ['err', 'CHARGE NOW'], stale: ['warn', 'No reading'] }[b.state] || ['warn', 'No reading'];
  return box(look[0], 'Battery', b.state === 'stale' ? null : num(b.volts, 1), 'V', look[1], `${b.pct}% of a 3S pack (10.8 to 12.6 V)`);
}
function renderBasic(data) {
  setHtml('chips-battery', batteryBox(data.battery));
  const rates = data.rates || {};
  const groups = { sensors: [], compute: [], actuation: [], autonomy: [] };
  for (const [kind, key, name, group] of INDICATORS) {
    if (kind === 'node') {
      const n = (data.nodes || {})[key];
      if (!n) continue;
      const [state, word] = NODE_LOOK[n.status] || ['warn', n.status];
      const hz = hzOf(rates[n.topic]);
      groups[group].push(box(state, name, hzText(hz), hz === null ? '' : 'Hz', word,
        `${n.label}, ${n.topic}${n.detail ? `: ${n.detail}` : ''}`));
    } else if (kind === 'health') {
      const h = (data.system_health || {})[key];
      if (!h) continue;
      groups[group].push(box(HEALTH_LOOK[h.status] || 'warn', name, null, '', h.word, `${h.label}: ${h.detail}`));
    } else {
      const a = data.autonomy || {};
      if (!a.status) continue;
      const [state, word] = AUTONOMY_LOOK[a.status] || ['warn', ''];
      groups[group].push(box(state, name, null, '', word, [a.headline, ...(a.lines || [])].join('. ')));
    }
  }
  for (const [group, boxes] of Object.entries(groups)) setHtml(`chips-${group}`, boxes.join(''));
}

function rateBadge(r) {
  if (r.off) return '<span class="nr-badge off">Off</span>';
  if (r.warming) return '<span class="nr-badge off">Measuring</span>';
  if (r.hz === null) return '<span class="nr-badge warn">No data</span>';
  return r.stale ? '<span class="nr-badge warn">Stale</span>' : '<span class="nr-badge ok">OK</span>';
}
function renderAdvanced(data) {
  const a = data.autonomy || {};
  if (a.status) {
    const [state, word] = AUTONOMY_LOOK[a.status] || ['warn', ''];
    // The color and the word already say whether the car is localized.
    const lines = (a.lines || []).filter((l) => l !== 'Localized' && l !== 'Not localized');
    setHtml('autonomy', box(state, a.headline, null, '', word, '', lines.map((l) => [l])));
  }
  const rates = data.rates || {};
  setHtml('nodes', Object.values(data.nodes || {}).map((n) => {
    const [state, word] = NODE_LOOK[n.status] || ['warn', n.status];
    const hz = hzOf(rates[n.topic]);
    const lines = [[n.topic, 'mono']];
    if (n.detail) lines.push([n.detail]);
    return box(state, n.label, hzText(hz), hz === null ? '' : 'Hz', word, '', lines);
  }).join(''));
  setHtml('system-health', Object.values(data.system_health || {}).map((h) =>
    box(HEALTH_LOOK[h.status] || 'warn', h.label, null, '', h.word, '', [[h.detail]])).join(''));
  setHtml('rates', Object.entries(rates).map(([topic, r]) => `<tr><td class="nr-mono">${esc(topic)}</td>
    <td class="nr-num">${r.hz === null ? '-' : `${num(r.hz, 1)} Hz`}</td><td>${rateBadge(r)}</td></tr>`).join(''));
  const wl = data.watchdog_log || [];
  $('watchdog-log').textContent = wl.length ? wl.join('\n') : 'No watchdog events yet.';
  $('log-dir').textContent = data.log_dir || '';
}

// The bar's badge: Fault only for a real fault, Check for anything else not running.
// Its hover text names the parts behind the badge.
function renderOverall(data) {
  const nodes = Object.values(data.nodes || {}), health = Object.values(data.system_health || {});
  const faults = health.filter((h) => h.status === 'dead');
  const checks = [...nodes, ...health].filter((n) => n.status !== 'healthy' && n.status !== 'off');
  const kind = faults.length ? 'err' : checks.length ? 'warn' : 'ok';
  const el = $('overall');
  el.className = `nr-badge ${kind}`;
  el.textContent = kind === 'ok' ? 'System OK' : 'Check system';
  const names = (kind === 'err' ? faults : checks).map((n) => n.label).join(', ');
  el.title = kind === 'ok'
    ? 'Every part under System status is running or turned off.'
    : `${kind === 'err' ? 'Fault' : 'Check'}: ${names}. Open System status below for details.`;
}

function setView(view) {
  $('basic').hidden = view !== 'basic';
  $('advanced').hidden = view !== 'advanced';
  $('view-basic').setAttribute('aria-pressed', view === 'basic');
  $('view-advanced').setAttribute('aria-pressed', view === 'advanced');
  store.set('nr-status-view', view);
}
$('view-basic').onclick = () => setView('basic');
$('view-advanced').onclick = () => setView('advanced');
setView(store.get('nr-status-view', 'basic'));
// Each folding section stays as this browser last left it.
for (const id of ['features-section', 'system']) {
  $(id).addEventListener('toggle', () => store.set(`nr-${id}-open`, $(id).open ? '1' : '0'));
  if (store.get(`nr-${id}-open`, '0') === '1') $(id).open = true;
}

let misses = 0;
function update(refresh) {
  return fetch(refresh ? '/api/status?refresh=1' : '/api/status', { cache: 'no-store' })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((data) => {
      apps = data.apps || [];
      $('host').textContent = data.host || '';
      renderApps();
      renderFeatures(data.features);
      renderBasic(data);
      renderAdvanced(data);
      renderOverall(data);
      $('timestamp').textContent = `Updated ${data.timestamp}`;
      misses = 0;
      const lv = $('live');
      lv.className = 'nr-live beat'; lv.querySelector('span').textContent = 'Live';
      $('main').classList.remove('nr-lost-data');
      requestAnimationFrame(() => setTimeout(() => { lv.className = 'nr-live'; }, 120));
    })
    .catch(() => {
      if (++misses >= MISSES) {
        const lv = $('live');
        lv.className = 'nr-live lost'; lv.querySelector('span').textContent = 'No answer';
        $('main').classList.add('nr-lost-data');
      }
    });
}
$('clear-apps').onclick = async () => {
  if (!confirm('Stop all lab dashboards?')) return;
  $('msg').textContent = 'Stopping lab dashboards...';
  try {
    const r = await (await fetch('/api/clear-apps', { method: 'POST' })).json();
    $('msg').textContent = r.message;
  } catch (err) { $('msg').textContent = 'Lost contact with the car.'; }
  update(true);
};
$('clear-log').onclick = async () => {
  try { await fetch('/api/clear-log', { method: 'POST' }); } catch (err) { /* shown on the next update */ }
  update(true);
};
$('refresh').onclick = () => update(true);

update(false);
setInterval(() => update(false), POLL_MS);
</script>
</body>
</html>
