# foxglove_bridge for validation sessions (slam_session.py): the map, scan,
# frames, and poses for Lichtblick; no camera streams, which would load the WiFi.
foxglove_bridge:
  ros__parameters:
    port: 8765
    topic_whitelist:
      - '^/map$'
      - '^/map_metadata$'
      - '^/scan$'
      - '^/tf$'
      - '^/tf_static$'
      - '^/robot_description$'
      - '^/odom/integrated$'
      - '^/pose$'
      - '^/amcl_pose$'
      - '^/particle_cloud$'
      - '^/slam_toolbox/graph_visualization$'
      - '^/autonomy/pose$'
      - '^/autonomy/status$'
    # Upstream sets clientPublish with /initialpose as the one client topic.
    # foxglove_bridge 3.x on Humble reads client_topic_whitelist but does not
    # apply it (foxglove-sdk PR #1508, open), so with clientPublish a client can
    # publish on any topic, /drive and /motor included. Humble cannot load an
    # empty list from a parameter file, and the bridge skips names that are not
    # capabilities, so 'none' stands for the empty list.
    capabilities: ['none']
    client_topic_whitelist: ['^/initialpose$']
    service_whitelist: ['^$']
    param_whitelist: ['^$']
