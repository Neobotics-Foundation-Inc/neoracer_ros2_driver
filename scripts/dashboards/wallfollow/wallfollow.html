<!DOCTYPE html>
<html lang="en" data-theme="dark" data-app="Wall follow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall Follow · NeoRacer</title>
<link rel="icon" href="/ui/brand/n-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/neoracer.css?v=2">
<script src="/ui/theme.js?v=2"></script>
<script src="/ui/lost.js?v=2" defer></script>
<script src="/ui/charts.js?v=2"></script>
<style>
  /* This page only. The shared pieces are in /ui/neoracer.css. */
  .lidar { aspect-ratio: 1; width: 100%; max-width: 560px; margin-inline: auto; }
  .zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .zoom .nr-btn { width: 36px; min-height: 36px; padding: 0; background: var(--nr-surface-2); }
  .err-chart { height: 300px; }
  .log-chart { height: 200px; }
  .field { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .field .name { font-weight: 700; font-size: 13px; }
  .field .unit { font-size: 12px; color: var(--nr-ink-2); }
  .field input[type=number].nr-input { width: 7rem; }
  label.slider { display: block; font-weight: 700; font-size: 13px; }
  label.slider b { font-variant-numeric: tabular-nums; }
  #form { display: grid; gap: 12px; }
  .readout { font: 400 13px/20px var(--nr-font-mono); color: var(--nr-ink-2); }
  select.nr-input { max-width: 220px; }
</style>
</head>
<body>
<header class="nr-header">
  <a class="nr-logo" id="home" href="/" aria-label="NeoRacer, back to the apps page">
    <img class="for-dark" src="/ui/brand/neoracer-logo-reversed.svg" alt="">
    <img class="for-light" src="/ui/brand/neoracer-logo.svg" alt="">
  </a>
  <span class="nr-divider"></span>
  <h1 class="nr-title">Wall Follow</h1>
  <div class="nr-meta">
    <span class="nr-live wait" id="live"><i></i><span>Waiting</span></span>
    <button type="button" class="nr-btn quiet small" onclick="reset()" title="Reload saved settings.">Reset</button>
    <button type="button" class="nr-btn danger small" onclick="stopCar()" title="Set speed to 0.">Stop</button>
    <div class="nr-seg" role="group" aria-label="Theme">
      <button type="button" data-theme-pick="dark">Dark</button>
      <button type="button" data-theme-pick="light">Light</button>
    </div>
  </div>
</header>

<main class="nr-main" id="main">
  <section class="nr-summary" aria-label="Summary">
    <div class="nr-stats">
      <div class="nr-stat" style="--len:7"><b id="mode">-</b><span>Mode</span></div>
      <div class="nr-stat" style="--len:6"><b id="err">-</b><span>Error</span></div>
      <div class="nr-stat" style="--len:6"><b id="steer">-</b><span>Steer</span></div>
      <div class="nr-stat" style="--len:6"><b id="thr">-</b><span>Throttle</span></div>
      <div class="nr-stat" style="--len:6"><b id="enc">-</b><span>Encoder m/s</span></div>
    </div>
  </section>

  <section class="nr-panel nr-span-4" aria-labelledby="t-lidar">
    <div class="nr-head"><h2 class="nr-panel-title" id="t-lidar">Lidar</h2></div>
    <div class="nr-view lidar">
      <canvas id="lidar" width="560" height="560"></canvas>
      <div class="zoom">
        <button type="button" class="nr-btn" onclick="zoom(1 / 1.25)" aria-label="Zoom in"><svg class="nr-icon"><use href="/ui/icons.svg#plus"/></svg></button>
        <button type="button" class="nr-btn" onclick="zoom(1.25)" aria-label="Zoom out"><svg class="nr-icon"><use href="/ui/icons.svg#minus"/></svg></button>
      </div>
      <span class="cap">Range <span id="lidarRange">4.0</span> m</span>
    </div>
  </section>

  <section class="nr-panel nr-span-4" aria-labelledby="t-error">
    <div class="nr-head"><h2 class="nr-panel-title" id="t-error">Error</h2></div>
    <div class="nr-chart err-chart" id="chart"></div>
    <div class="nr-legend" id="chartLegend"></div>
  </section>

  <section class="nr-panel nr-span-4" aria-labelledby="t-tune">
    <div class="nr-head"><h2 class="nr-panel-title" id="t-tune">Tune</h2></div>
    <div id="form"></div>
    <div class="nr-actions">
      <button type="button" class="nr-btn primary small" onclick="apply()">Apply</button>
      <button type="button" class="nr-btn small" onclick="saveTune()">Save</button>
      <button type="button" class="nr-btn small" onclick="loadTune()">Load</button>
    </div>
    <p class="nr-note">Press Apply before Save. Save keeps only applied values.</p>
    <div class="readout" id="detail"></div>
  </section>

  <section class="nr-panel" aria-labelledby="t-logs">
    <div class="nr-head"><h2 class="nr-panel-title" id="t-logs">Logs</h2></div>
    <div class="nr-actions">
      <button type="button" class="nr-btn small" onclick="saveLog()">Save log</button>
      <select class="nr-input" id="logsel" aria-label="Log file"></select>
      <button type="button" class="nr-btn small" onclick="loadLog()">Load log</button>
      <span class="nr-note" id="loginfo"></span>
    </div>
    <div class="nr-chart log-chart" id="logChart"></div>
    <div class="nr-legend" id="logLegend"></div>
  </section>
</main>
<div id="nr-toast" role="status"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const { timeChart, legendHtml, recentTicks, niceTicks } = NrCharts;
// The theme's colors, read when drawing, so the canvas follows Dark and Light.
const ink = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
$('home').href = `${location.protocol}//${location.hostname}:8080/`;
const FIELDS = { static: ['speed', 'kp', 'kd', 'speed_kp', 'speed_kd', 'window', 'lookahead'],
                 dynamic: ['speed', 'kp', 'kd', 'speed_kp', 'speed_kd', 'window', 'lookahead', 'width', 'side_weight'] };
const UNITS = { kp: 'steer per m of error', kd: 'damper gain', speed_kp: 'throttle per m/s of error',
                speed_kd: 'speed error damper', window: 'deg', lookahead: 'm', width: 'deg',
                side_weight: 'm per deg; + prefers right' };
const STEPS = { kp: '0.01', kd: '0.01', speed_kp: '0.01', speed_kd: '0.01', side_weight: '0.01' };
let mode = 'static';

function post(path, body) { return fetch(path, { method: 'POST', body: body ? JSON.stringify(body) : null }); }
function toast(msg) {
  const t = $('nr-toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function saveTune() { post('/save').then(() => toast('Saved to the car profile.')); }
function loadTune() { post('/load').then(() => { $('form').dataset.mode = ''; toast('Loaded.'); }); }
function reset() { post('/load').then(() => { $('form').dataset.mode = ''; }); }
function stopCar() { post('/params', { speed: 0 }).then(() => { $('form').dataset.mode = ''; }); }
function apply() {
  const out = {};
  for (const f of FIELDS[mode]) out[f] = parseFloat($('in_' + f).value);
  post('/params', out).then(() => toast('Applied.'));
}

// The slider's red fill follows its value.
function fill(el) { el.style.setProperty('--v', `${(el.value - el.min) / (el.max - el.min) * 100}%`); }

function buildForm(params) {
  // Rebuild only when the mode changes, so typing is not interrupted.
  if ($('form').dataset.mode === mode) return;
  $('form').dataset.mode = mode;
  $('form').innerHTML = FIELDS[mode].map((f) => f === 'speed'
    // Speed applies while dragging.
    ? `<label class="slider">speed (0 to 1, times max_mps) <b id="speedval">${params.speed}</b>
       <input id="in_speed" type="range" min="0" max="1" step="0.01" value="${params.speed}"></label>`
    : `<div class="field"><div><div class="name">${f}</div><div class="unit">${UNITS[f]}</div></div>
       <input id="in_${f}" class="nr-input" type="number" step="${STEPS[f] || 'any'}" value="${params[f]}" aria-label="${f}"></div>`).join('');
  fill($('in_speed'));
  $('in_speed').oninput = (e) => { fill(e.target); $('speedval').textContent = e.target.value; post('/params', { speed: parseFloat(e.target.value) }); };
}

// ---- lidar ----
let VIEW = 4.0;
function zoom(f) { VIEW = Math.min(12, Math.max(1, VIEW * f)); }
$('lidar').addEventListener('wheel', (e) => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.2 : 1 / 1.2); });
function drawLidar(scan, ov) {
  const c = $('lidar'), x = c.getContext('2d');
  const cx = c.width / 2, cy = c.height / 2, k = (cx - 10) / VIEW;
  const L = ov.la ? Math.min(ov.la, VIEW) : VIEW;
  const fg = ink('--nr-ink'), dim = ink('--nr-ink-3'), red = ink('--nr-red');
  x.clearRect(0, 0, c.width, c.height);
  x.strokeStyle = ink('--nr-edge'); x.lineWidth = 1;
  for (let r = 1; r <= VIEW; r++) { x.beginPath(); x.arc(cx, cy, r * k, 0, 2 * Math.PI); x.stroke(); }
  // 0 deg is the nose (up); positive degrees are to the right.
  x.fillStyle = fg;
  for (const [deg, r] of scan) {
    const a = deg * Math.PI / 180;
    x.fillRect(cx + Math.sin(a) * r * k - 1.5, cy - Math.cos(a) * r * k - 1.5, 3, 3);
  }
  const ray = (deg, r, color, w) => {
    const a = deg * Math.PI / 180;
    x.strokeStyle = color; x.lineWidth = w; x.beginPath();
    x.moveTo(cx, cy); x.lineTo(cx + Math.sin(a) * r * k, cy - Math.cos(a) * r * k); x.stroke();
  };
  if (ov.mode === 'static') {
    for (const s of [1, -1]) {
      ray(s * ov.look_angle - ov.window / 2, L, dim, 1);
      ray(s * ov.look_angle + ov.window / 2, L, dim, 1);
      ray(s * ov.look_angle, Math.min(s > 0 ? ov.right : ov.left, VIEW), red, 3);
    }
  } else if (ov.mode === 'dynamic') {
    ray(-ov.width, L, dim, 1);
    ray(ov.width, L, dim, 1);
    ray(ov.target_deg, L, red, 3);
  }
  x.fillStyle = fg;
  x.beginPath(); x.moveTo(cx, cy - 10); x.lineTo(cx - 7, cy + 8); x.lineTo(cx + 7, cy + 8); x.fill();
  $('lidarRange').textContent = VIEW.toFixed(1);
}

const shown = new Map();
function setLegend(id, html) { if (shown.get(id) !== html) { shown.set(id, html); $(id).innerHTML = html; } }

// Live while the car answers; No answer after a second of missed polls.
let misses = 0, lastBeat = 0;
function beat(ok) {
  const el = $('live'), word = el.querySelector('span');
  if (ok) {
    misses = 0;
    $('main').classList.remove('nr-lost-data');
    if (Date.now() - lastBeat < 1000) return;
    lastBeat = Date.now();
    el.className = 'nr-live beat'; word.textContent = 'Live';
    setTimeout(() => { el.className = 'nr-live'; }, 120);
  } else if (++misses >= 8) {
    el.className = 'nr-live lost'; word.textContent = 'No answer';
    $('main').classList.add('nr-lost-data');
  }
}

let busy = false;
function update() {
  if (busy) return;
  busy = true;
  fetch('/state').then((r) => r.json()).then((d) => {
    busy = false;
    beat(true);
    mode = (d.params.mode == 1 || d.params.mode === 'dynamic') ? 'dynamic' : 'static';
    const ov = d.overlay || {};
    $('mode').textContent = mode;
    $('err').textContent = ov.error ?? '-';
    $('steer').textContent = ov.steer ?? '-';
    $('thr').textContent = ov.speed_cmd ?? '-';
    $('enc').textContent = d.enc_speed;
    buildForm(d.params);
    $('detail').textContent = mode === 'static'
      ? `left ${ov.left ?? '-'} m  right ${ov.right ?? '-'} m`
      : `target ${ov.target_deg ?? '-'} deg`;
    drawLidar(d.scan, ov);
    $('lidar').title = mode === 'static' ? 'Red: measured distances. Gray: averaging windows.' : 'Red: target heading. Gray: search arc.';
    // Static error is meters, shown in cm; dynamic error is -1 to 1.
    const cm = mode === 'static', hist = d.hist || [];
    const now = hist.length ? hist[hist.length - 1][0] : 0;
    timeChart($('chart'), now - 30, now,
      [{ name: 'Error', style: 'a', axis: 'l', unit: cm ? 'cm' : '', digits: cm ? 0 : 2, minSpan: cm ? 5 : 0.1,
         pts: hist.map((r) => [r[0], cm ? r[1] * 100 : r[1]]) }],
      recentTicks(now, 10), { gapSec: 0.5, marks: d.marks });
    setLegend('chartLegend', legendHtml([{ name: cm ? 'Error (cm): right minus left, setpoint 0' : 'Error (-1 to 1), setpoint 0', style: 'a' }]));
  }).catch(() => { busy = false; beat(false); });
}

// ---- logs ----
const logTicks = (t0) => Object.assign((a, b) => {
  const step = niceTicks(0, b - a, 5)[1] || 1, out = [];
  for (let s = 0; s <= b - a + 1e-6; s += step) out.push([a + s, `${(a + s - t0).toFixed(0)} s`]);
  return out;
}, { label: (t) => `${(t - t0).toFixed(1)} s` });
function loadLog() {
  const f = $('logsel').value;
  if (!f) return;
  fetch('/logs/' + f).then((r) => r.text()).then((txt) => {
    const lines = txt.trim().split('\n');
    const marks = lines.filter((l) => l.startsWith('# mark')).map((l) => { const p = l.split(','); return [parseFloat(p[1]), p.slice(2).join(',')]; });
    const rows = lines.filter((l) => !l.startsWith('#')).slice(1).map((l) => l.split(',').map(Number));
    $('loginfo').textContent = `${f}: ${rows.length} rows, ${marks.length} changes`;
    if (!rows.length) return;
    const t0 = rows[0][0], t1 = rows[rows.length - 1][0];
    timeChart($('logChart'), t0, t1, [
      { name: 'Error', style: 'a', axis: 'l', unit: '', digits: 3, minSpan: 0.1, pts: rows.map((r) => [r[0], r[1]]) },
      { name: 'Encoder', style: 'b', axis: 'r', unit: 'm/s', digits: 2, minSpan: 0.2, pts: rows.map((r) => [r[0], r[4]]) },
    ], logTicks(t0), { gapSec: 0.5, marks });
    setLegend('logLegend', legendHtml([{ name: 'Error (left)', style: 'a' }, { name: 'Encoder (m/s, right)', style: 'b' }]));
  });
}
function saveLog() { post('/logs/save').then(() => { refreshLogs(true); toast('Log saved.'); }); }
function refreshLogs(loadLatest) {
  fetch('/logs').then((r) => r.json()).then((names) => {
    const sel = $('logsel');
    sel.innerHTML = names.map((n) => `<option>${n}</option>`).join('');
    sel.selectedIndex = names.length - 1;
    if (loadLatest && names.length) loadLog();
  });
}
refreshLogs(false);

update();
setInterval(update, 120);
</script>
</body>
</html>
