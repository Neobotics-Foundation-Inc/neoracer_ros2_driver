# NeoRacer Camera Label Dashboard settings: the shipped defaults. A car's own
# values go in the car profile, ~/.config/racecar/dashboards/camlabel.yaml,
# which loads on top of this file; a driver update leaves that file alone.
# Restart the service after editing:
#   racecar service restart camlabel
preview_width: 320    # width in pixels of the live view sent to the browser.
                      # Height follows the camera aspect. Smaller = less WiFi.
preview_quality: 45   # jpeg quality 1..100 for the live view.
