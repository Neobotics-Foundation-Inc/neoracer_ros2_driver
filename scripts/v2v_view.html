<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeoRacer bird's-eye view</title>
<style>
  :root { --navy: #1B2036; --ink: #E2E2E2; --mute: #8A8FA3; --red: #FF0033; --line: #2C3350; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--navy); color: var(--ink);
    font: 13px/1.35 "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  #panel { position: fixed; top: 12px; left: 12px; background: rgba(20, 24, 42, 0.92);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 300px; }
  #panel h1 { font-size: 14px; font-weight: 700; letter-spacing: 0.02em; }
  #panel h1::after { content: ""; display: block; width: 22px; height: 2px;
    background: var(--red); margin: 4px 0 8px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th { color: var(--mute); font-weight: 600; text-align: right; padding: 2px 6px; }
  td { text-align: right; padding: 3px 6px; border-top: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 6px; vertical-align: -1px; }
  .stale td { color: var(--mute); }
  #note { color: var(--mute); margin-top: 8px; max-width: 320px; }
  #tools { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; }
  button { background: rgba(20, 24, 42, 0.92); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button.on { border-color: var(--red); }
  #scale { position: fixed; bottom: 14px; right: 14px; color: var(--mute); }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="panel">
  <h1>NeoRacer bird's-eye view</h1>
  <table>
    <thead><tr><th>Car</th><th>m/s</th><th>Heading</th><th>Battery</th><th>Data</th></tr></thead>
    <tbody id="rows"><tr><td colspan="5">Waiting for cars on V2V</td></tr></tbody>
  </table>
  <div id="note">Positions are each car's odometry from where its driver started.
    Scroll to zoom, drag to move.</div>
</div>
<div id="tools">
  <button id="fit" class="on">Fit</button>
  <button id="paths" class="on">Paths</button>
</div>
<div id="scale"></div>
<script>
const COLOURS = ['#FF0033', '#E2E2E2', '#3FA7D6', '#F2A541', '#7BD389', '#B48EF0'];
// The car as drawn: its body (metres, lidar to tail and either side) and
// the stale age (s) after which its row greys out.
const CAR_LONG = 0.48, CAR_WIDE = 0.27, STALE = 1.0;
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
let cars = {};
let view = { fit: true, scale: 60, cx: 0, cy: 0 };
let showPaths = true;
let drag = null;

function colour(id) {
  const ids = Object.keys(cars).sort((a, b) => a - b);
  return COLOURS[ids.indexOf(id) % COLOURS.length];
}

function fitView(w, h) {
  let xs = [], ys = [];
  for (const car of Object.values(cars)) {
    if (car.pose) { xs.push(car.pose[0]); ys.push(car.pose[1]); }
    if (showPaths) for (const p of car.trail) { xs.push(p[0]); ys.push(p[1]); }
  }
  if (!xs.length) { xs = [0]; ys = [0]; }
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const span = Math.max(x1 - x0, y1 - y0, 4) * 1.3;
  view.cx = (x0 + x1) / 2; view.cy = (y0 + y1) / 2;
  view.scale = Math.min(w, h) / span;
}

function toScreen(x, y, w, h) {
  return [w / 2 + (x - view.cx) * view.scale, h / 2 - (y - view.cy) * view.scale];
}

function gridStep() {
  for (const s of [0.1, 0.25, 0.5, 1, 2, 5, 10, 20, 50]) if (s * view.scale >= 55) return s;
  return 100;
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
    canvas.width = w * dpr; canvas.height = h * dpr;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#1B2036';
  ctx.fillRect(0, 0, w, h);
  if (view.fit) fitView(w, h);

  // the grid, a line every `step` metres, the origin's axes brighter
  const step = gridStep();
  const left = view.cx - w / 2 / view.scale, right = view.cx + w / 2 / view.scale;
  const bottom = view.cy - h / 2 / view.scale, top = view.cy + h / 2 / view.scale;
  ctx.lineWidth = 1;
  ctx.font = '11px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#5A6080';
  for (let x = Math.ceil(left / step) * step; x <= right; x += step) {
    const [sx] = toScreen(x, 0, w, h);
    ctx.strokeStyle = Math.abs(x) < step / 2 ? '#4A5275' : '#262C46';
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, h); ctx.stroke();
    ctx.fillText(+x.toFixed(2) + ' m', sx + 3, h - 6);
  }
  for (let y = Math.ceil(bottom / step) * step; y <= top; y += step) {
    const [, sy] = toScreen(0, y, w, h);
    ctx.strokeStyle = Math.abs(y) < step / 2 ? '#4A5275' : '#262C46';
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(w, sy); ctx.stroke();
    ctx.fillText(+y.toFixed(2) + ' m', 4, sy - 3);
  }

  for (const [id, car] of Object.entries(cars)) {
    const c = colour(id);
    if (showPaths && car.trail.length > 1) {
      ctx.strokeStyle = c; ctx.globalAlpha = 0.55; ctx.lineWidth = 2;
      ctx.beginPath();
      car.trail.forEach((p, i) => {
        const [sx, sy] = toScreen(p[0], p[1], w, h);
        if (i) ctx.lineTo(sx, sy); else ctx.moveTo(sx, sy);
      });
      ctx.stroke(); ctx.globalAlpha = 1;
    }
    if (!car.pose) continue;
    const [sx, sy] = toScreen(car.pose[0], car.pose[1], w, h);
    const k = Math.max(view.scale, 40);
    const len = CAR_LONG * k, wide = CAR_WIDE * k;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(-car.pose[2]);
    ctx.globalAlpha = car.age > STALE ? 0.4 : 1;
    ctx.fillStyle = c;
    ctx.beginPath();
    // body: tail to nose along +x, the nose a point so the heading reads
    ctx.moveTo(-len * 0.5, -wide / 2);
    ctx.lineTo(len * 0.3, -wide / 2);
    ctx.lineTo(len * 0.5, 0);
    ctx.lineTo(len * 0.3, wide / 2);
    ctx.lineTo(-len * 0.5, wide / 2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '600 12px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('Car ' + id, sx + wide * 0.8, sy - wide * 0.8);
  }
  document.getElementById('scale').textContent = 'grid ' + step + ' m';
}

function rows() {
  const ids = Object.keys(cars).sort((a, b) => a - b);
  if (!ids.length) return '<tr><td colspan="5">Waiting for cars on V2V</td></tr>';
  return ids.map(id => {
    const car = cars[id];
    const f = (v, d) => v === null || v === undefined ? '-' : v.toFixed(d);
    const heading = car.pose ? f(((car.pose[2] * 180 / Math.PI) % 360 + 360) % 360, 0) + '&deg;' : '-';
    const batt = car.batt === null ? '-' : Math.round(car.batt * 100) + '%';
    const age = car.age > STALE ? 'none for ' + car.age.toFixed(0) + ' s' : car.age.toFixed(1) + ' s';
    return '<tr class="' + (car.age > STALE ? 'stale' : '') + '"><td><span class="swatch" style="background:' +
      colour(id) + '"></span>Car ' + id + '</td><td>' + f(car.speed, 2) + '</td><td>' + heading +
      '</td><td>' + batt + '</td><td>' + age + '</td></tr>';
  }).join('');
}

async function poll() {
  try {
    const r = await fetch('/state', { cache: 'no-store' });
    cars = (await r.json()).cars;
    document.getElementById('rows').innerHTML = rows();
  } catch (e) {
    document.getElementById('rows').innerHTML = '<tr><td colspan="5">v2v_view.py is not running</td></tr>';
  }
  setTimeout(poll, 100);
}

function frame() { draw(); requestAnimationFrame(frame); }

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const mx = view.cx + (e.clientX - w / 2) / view.scale, my = view.cy - (e.clientY - h / 2) / view.scale;
  view.scale *= Math.exp(-e.deltaY * 0.0015);
  view.cx = mx - (e.clientX - w / 2) / view.scale;
  view.cy = my + (e.clientY - h / 2) / view.scale;
  setFit(false);
}, { passive: false });
canvas.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy };
  canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  view.cx = drag.cx - (e.clientX - drag.x) / view.scale;
  view.cy = drag.cy + (e.clientY - drag.y) / view.scale;
  setFit(false);
});
canvas.addEventListener('pointerup', () => { drag = null; canvas.classList.remove('drag'); });

function setFit(on) {
  view.fit = on;
  document.getElementById('fit').classList.toggle('on', on);
}
document.getElementById('fit').onclick = () => setFit(true);
document.getElementById('paths').onclick = e => {
  showPaths = !showPaths;
  e.target.classList.toggle('on', showPaths);
};

poll();
frame();
</script>
</body>
</html>
