<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Health · NeoRacer</title>
<link rel="icon" href="/ui/brand/n-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/neoracer.css?v=2">
<script src="/ui/theme.js?v=2"></script>
<script src="/ui/charts.js?v=2" defer></script>
<style>
  /* This page only: the load chart's height. */
  .load-chart { height: 220px; }
</style>
</head>
<body>
<header class="nr-header">
  <a class="nr-logo" href="/" aria-label="NeoRacer, back to the system page">
    <img class="for-dark" src="/ui/brand/neoracer-logo-reversed.svg" alt="">
    <img class="for-light" src="/ui/brand/neoracer-logo.svg" alt="">
  </a>
  <span class="nr-divider"></span>
  <h1 class="nr-title">System Health</h1>
  <div class="nr-meta">
    <span class="nr-live wait" id="live"><i></i><span>Waiting</span></span>
    <div class="nr-seg" role="group" aria-label="Theme">
      <button type="button" data-theme-pick="dark">Dark</button>
      <button type="button" data-theme-pick="light">Light</button>
    </div>
  </div>
</header>

<main class="nr-main" id="main">
  <section class="nr-summary" aria-label="Summary">
    <div class="nr-stats">
      <div class="nr-stat" style="--len:5"><b id="s-batt">?</b><span>Battery</span></div>
      <div class="nr-stat" style="--len:5"><b id="s-cpu">?</b><span>CPU</span></div>
      <div class="nr-stat" style="--len:5"><b id="s-gpu">?</b><span>GPU</span></div>
      <div class="nr-stat" style="--len:6"><b id="s-ram">?</b><span>RAM used</span></div>
      <div class="nr-stat" style="--len:5"><b id="s-power">?</b><span>Board power</span></div>
      <div class="nr-stat" style="--len:5"><b id="s-temp">?</b><span>Junction</span></div>
      <div class="nr-stat" style="--len:5"><b id="s-fan">?</b><span>Fan</span></div>
    </div>
  </section>

  <section class="nr-panel nr-span-6" aria-labelledby="t-temp">
    <div class="nr-head"><h2 class="nr-panel-title" id="t-temp">Temperature</h2></div>
    <div class="nr-nodes" id="temps"></div>
  </section>

  <section class="nr-panel nr-span-6" aria-labelledby="t-power">
    <div class="nr-head">
      <h2 class="nr-panel-title" id="t-power">Power</h2>
      <span class="nr-badge" id="power-mode">Mode ?</span>
    </div>
    <div class="nr-nodes" id="rails"></div>
  </section>

  <section class="nr-panel nr-span-8" aria-labelledby="t-load">
    <div class="nr-head">
      <h2 class="nr-panel-title" id="t-load">Load</h2>
      <div class="nr-legend" id="load-legend"></div>
    </div>
    <div class="nr-chart load-chart" id="load-chart"></div>
  </section>

  <section class="nr-panel nr-span-4" aria-labelledby="t-board">
    <div class="nr-head"><h2 class="nr-panel-title" id="t-board">Board</h2></div>
    <div class="nr-fields">
      <div class="nr-field"><div class="name">CPU clock <span class="unit">MHz</span> <b id="f-cpu-clock">?</b></div></div>
      <div class="nr-field"><div class="name">GPU clock <span class="unit">MHz</span> <b id="f-gpu-clock">?</b></div></div>
      <div class="nr-field"><div class="name">Fan <span class="unit">percent</span> <b id="f-fan-pct">?</b></div></div>
      <div class="nr-field"><div class="name">Disk <span class="unit">GiB free</span> <b id="f-disk">?</b></div></div>
      <div class="nr-field"><div class="name">Uptime <b id="f-uptime">?</b></div></div>
    </div>
    <div class="nr-nodes" id="board-status"></div>
  </section>

  <section class="nr-panel" aria-labelledby="t-nodes">
    <div class="nr-head"><h2 class="nr-panel-title" id="t-nodes">Nodes</h2><span class="nr-note" id="nodes-count"></span></div>
    <div class="nr-nodes" id="nodes"></div>
  </section>

</main>

<script>
(function () {
  'use strict';
  const POLL_MS = 2000;
  const MISSES = 2;                     // missed polls before the page says it lost the car
  const HISTORY_S = 120;                // the load chart's window
  const TEMP_OK_C = 70, TEMP_HOT_C = 85; // the system page's limits
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const num = (v, d = 0) => (v === null || v === undefined ? '?' : Number(v).toFixed(d));
  const history = { cpu: [], gpu: [] };
  let misses = 0;

  // One box in the one grammar: its name, its value top right, a word only for a problem.
  function box(state, name, value, unit, word, title) {
    const sr = { ok: 'Running', warn: 'Check', err: 'Fault', off: 'Off' }[state];
    return `<div class="nr-status ${state}"${title ? ` title="${esc(title)}"` : ''}>
      <div class="top"><span class="name">${esc(name)}</span>${value === null ? '' : `<span class="value">${esc(value)}${unit ? `<small>${esc(unit)}</small>` : ''}</span>`}</div>
      ${word ? `<span class="nr-word">${esc(word)}</span>` : ''}<span class="nr-sr">${sr}${word ? `: ${esc(word)}` : ''}</span></div>`;
  }

  function tempState(c) {
    if (c === null || c === undefined) return ['warn', 'No reading'];
    if (c < TEMP_OK_C) return ['ok', ''];
    if (c < TEMP_HOT_C) return ['warn', 'Warm'];
    return ['err', 'HOT'];
  }

  // The 3S pack, from the 8080 server's battery reading: ok, low, charge (below 10.8 V) or stale.
  function batteryBox(b) {
    if (!b) return box('warn', 'Battery', null, '', 'No reading');
    const look = { ok: ['ok', ''], low: ['warn', 'Low'], charge: ['err', 'CHARGE NOW'], stale: ['warn', 'No reading'] }[b.state] || ['warn', 'No reading'];
    return box(look[0], 'Battery', num(b.volts, 1), 'V', look[1], `${b.pct}% of a 3S pack (10.8 to 12.6 V)`);
  }

  function renderHost(h) {
    const ram = h.memory_mib, rails = h.power_rails || {}, fan = h.fan || {}, gpu = h.gpu || {}, batt = h.battery;
    $('s-batt').innerHTML = batt && batt.state !== 'stale' ? `${num(batt.volts, 1)}<small>V</small>` : '?';
    $('s-cpu').innerHTML = h.cpu.load_pct === null ? '?' : `${num(h.cpu.load_pct)}<small>%</small>`;
    $('s-gpu').innerHTML = gpu.load_pct === null || gpu.load_pct === undefined ? '?' : `${num(gpu.load_pct)}<small>%</small>`;
    $('s-ram').innerHTML = ram ? `${num(ram.used / 1024, 1)}<small>GB</small>` : '?';
    $('s-power').innerHTML = rails.VDD_IN ? `${num(rails.VDD_IN.mw / 1000, 1)}<small>W</small>` : '?';
    $('s-temp').innerHTML = h.soc_temp_c === null ? '?' : `${num(h.soc_temp_c)}<small>°C</small>`;
    $('s-fan').innerHTML = fan.rpm === null || fan.rpm === undefined ? '?' : `${num(fan.rpm)}<small>rpm</small>`;

    $('temps').innerHTML = Object.entries(h.temps_c || {}).map(([zone, c]) => {
      const [state, word] = tempState(c);
      return box(state, zone.replace('-thermal', ''), num(c, 1), '°C', word, zone);
    }).join('') || box('warn', 'Zones', null, '', 'No reading');

    $('rails').innerHTML = batteryBox(batt) + (Object.entries(rails).map(([label, r]) =>
      box('ok', label.replace('VDD_', ''), num(r.mw / 1000, 2), 'W', '', `${label}: ${r.mv} mV, ${r.ma} mA`)).join('')
      || box('warn', 'Power monitor', null, '', 'Not detected'));
    const pm = h.power_mode || {};
    $('power-mode').textContent = pm.name ? `Mode ${pm.name}` : 'Mode ?';
    const th = h.throttle || {};
    $('rails').insertAdjacentHTML('beforeend', th.flags === null || th.flags === undefined
      ? box('warn', 'Throttling', null, '', 'No reading')
      : th.flags ? box('warn', 'Throttling', null, '', 'Has occurred', th.active.join('\n')) : box('ok', 'Throttling', null, '', ''));

    $('f-cpu-clock').textContent = h.cpu.cur_mhz === null ? '?' : `${h.cpu.cur_mhz} / ${h.cpu.max_mhz}`;
    $('f-gpu-clock').textContent = gpu.cur_mhz ? `${num(gpu.cur_mhz)}${gpu.max_mhz ? ` / ${num(gpu.max_mhz)}` : ''}` : '?';
    $('f-fan-pct').textContent = num(fan.percent);
    $('f-disk').textContent = h.disk_gib ? `${h.disk_gib.free} of ${h.disk_gib.total}` : '?';
    $('f-uptime').textContent = h.uptime || '?';
    $('board-status').innerHTML =
      (h.ntp_synchronized ? box('ok', 'Clock', null, '', '') : box('warn', 'Clock', null, '', 'Not synced'))
      + (fan.rpm ? box('ok', 'Fan', num(fan.rpm), 'rpm', '') : box('warn', 'Fan', null, '', 'No reading'));

    const now = Date.now() / 1000;
    if (h.cpu.load_pct !== null) history.cpu.push([now, h.cpu.load_pct]);
    if (gpu.load_pct !== null && gpu.load_pct !== undefined) history.gpu.push([now, gpu.load_pct]);
    for (const k of Object.keys(history)) history[k] = history[k].filter((p) => p[0] >= now - HISTORY_S);
    drawLoad(now);
  }

  function drawLoad(now) {
    if (!window.NrCharts) return;
    const series = [
      { name: 'CPU', style: 'a', axis: 'l', unit: '%', digits: 0, pts: history.cpu },
      { name: 'GPU', style: 'b', axis: 'l', unit: '%', digits: 0, pts: history.gpu },
    ];
    $('load-legend').innerHTML = NrCharts.legendHtml(series);
    NrCharts.timeChart($('load-chart'), now - HISTORY_S, now, series, NrCharts.recentTicks(now, 30),
      { gapSec: 5, fixed: { l: [0, 100] } });
  }

  function renderNodes(s) {
    const nodes = Object.values(s.nodes || {}), rates = s.rates || {};
    const words = { stale: 'No data', dead: 'Not detected', unsupervised: 'Not detected' };
    const state = { healthy: 'ok', off: 'off' };
    $('nodes').innerHTML = nodes.map((n) => {
      const hz = rates[n.topic] && rates[n.topic].hz;
      return box(state[n.status] || 'warn', n.label, hz ? num(hz, hz < 10 ? 1 : 0) : null, hz ? 'Hz' : '',
        words[n.status] || '', n.topic);
    }).join('');
    const up = nodes.filter((n) => n.status === 'healthy').length;
    $('nodes-count').textContent = nodes.length ? `${up} of ${nodes.length} running` : '';
  }

  async function get(url) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), POLL_MS - 200);
    try {
      const r = await fetch(url, { cache: 'no-store', signal: ctl.signal });
      if (!r.ok) throw new Error(r.status);
      return await r.json();
    } finally { clearTimeout(timer); }
  }

  async function poll() {
    const live = $('live');
    try {
      const [host, status] = await Promise.all([get('/api/host'), get('/api/status').catch(() => null)]);
      renderHost(host);
      if (status) renderNodes(status);
      misses = 0;
      live.className = 'nr-live beat'; live.querySelector('span').textContent = 'Live';
      $('main').classList.remove('nr-lost-data');
      requestAnimationFrame(() => setTimeout(() => { live.className = 'nr-live'; }, 120));
    } catch (err) {
      if (++misses >= MISSES) {
        live.className = 'nr-live lost'; live.querySelector('span').textContent = 'No answer';
        $('main').classList.add('nr-lost-data');
      }
    }
  }

  window.addEventListener('resize', () => drawLoad(Date.now() / 1000));

  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
