<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeoRacer</title>
<link rel="icon" href="/ui/brand/n-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/neoracer.css?v=2">
<script src="/ui/theme.js?v=2"></script>
<style>
  /* This page only: one app opening, its tile in yellow while it starts and a bar that fills. */
  .launch { max-width: 460px; margin: 0 auto; padding: 15vh 16px 32px; }
  .launch .nr-panel { align-items: center; text-align: center; }
  .glyph { width: 76px; height: 76px; border-radius: 20px; display: grid; place-items: center; background: var(--nr-warn); color: var(--nr-ink-on-warn); }
  .glyph.err { background: var(--nr-red); color: var(--nr-ink-on-red); }
  .glyph .nr-icon { width: 34px; height: 34px; }
  .bar { width: 100%; height: 10px; border-radius: 5px; background: var(--nr-surface-2); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--nr-red); transition: width 0.4s ease-out; }
  #note { min-height: 20px; }
  @media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
</style>
</head>
<body>
<header class="nr-header">
  <a class="nr-logo" href="/" aria-label="NeoRacer, back to the apps page">
    <img class="for-dark" src="/ui/brand/neoracer-logo-reversed.svg" alt="">
    <img class="for-light" src="/ui/brand/neoracer-logo.svg" alt="">
  </a>
</header>
<main class="launch">
  <section class="nr-panel">
    <div class="glyph" id="glyph"></div>
    <h2 id="title">Opening...</h2>
    <div class="bar" role="progressbar" aria-label="Loading"><div id="fill"></div></div>
    <p class="nr-note" id="note"></p>
    <a class="nr-btn quiet small" id="cancel" href="/">Cancel</a>
  </section>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const id = new URLSearchParams(location.search).get('app') || '';
const LIMIT_MS = 60000;
const POLL_MS = 500;

const FILL_MS = 400;
function fillTo(pct) {
  $('fill').style.width = `${pct}%`;
  return new Promise((res) => setTimeout(res, FILL_MS + 100));
}
let cancelled = false;
function fail(text) {
  $('title').textContent = 'Could not open';
  $('note').textContent = text;
  $('glyph').classList.add('err');
}
// Close this tab; the apps page is still open in the tab that opened it. A
// tab the page did not open cannot close itself, so it goes to the apps page.
$('cancel').onclick = (e) => {
  e.preventDefault();
  cancelled = true;
  window.close();
  setTimeout(() => location.replace('/'), 300);
};

async function launch() {
  $('note').textContent = '';
  $('fill').style.width = '0';
  let app = null;
  try {
    app = ((await (await fetch('/api/status')).json()).apps || []).find((a) => a.id === id);
  } catch (err) { /* reported below */ }
  if (!app) { fail('Unknown app.'); return; }
  document.title = `${app.name} · NeoRacer`;
  $('glyph').innerHTML = `<svg class="nr-icon" aria-hidden="true"><use href="/ui/icons.svg#${app.icon}"/></svg>`;
  $('title').textContent = `Opening ${app.name}...`;
  try {
    const r = await (await fetch('/api/open', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ app: id }),
    })).json();
    if (!r.ok) { fail(r.message); return; }
  } catch (err) { fail('Lost contact with the car.'); return; }

  const t0 = Date.now();
  for (;;) {
    const elapsed = Date.now() - t0;
    // Most apps answer within 5 to 15 s; the bar slows toward the end rather than stopping.
    $('fill').style.width = `${Math.round(95 * (1 - Math.exp(-elapsed / 6000)))}%`;
    try {
      const s = await (await fetch(`/api/ready?app=${encodeURIComponent(id)}`)).json();
      if (cancelled) return;
      if (s.ready) {
        // Let the bar reach the end before the app replaces this page.
        await fillTo(100);
        location.replace(`${location.protocol}//${location.hostname}:${s.port}/`);
        return;
      }
    } catch (err) { /* keep trying until the limit */ }
    if (elapsed > LIMIT_MS) { fail(`${app.name} did not start.`); return; }
    await new Promise((res) => setTimeout(res, POLL_MS));
  }
}
launch();
</script>
</body>
</html>
