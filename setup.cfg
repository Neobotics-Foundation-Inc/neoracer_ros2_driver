[develop]
script_dir=$base/lib/neoracer_ros2_driver
[install]
install_scripts=$base/lib/neoracer_ros2_driver

[tool:pytest]
# Upstream lab-dashboard checkouts ship their own tests/ directories; collecting
# them would run third-party suites as part of this package's.
norecursedirs = scripts/dashboards build install log
markers =
    hardware: tests requiring physical hardware (cameras, IMU, LIDAR, etc.)
filterwarnings =
    ignore:.*multi-threaded.*fork.*:DeprecationWarning
