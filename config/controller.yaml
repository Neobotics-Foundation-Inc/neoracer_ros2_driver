controller_node:
  ros__parameters:
    # ---- ESP32 serial link ----
    # /dev/osrbot_base is the stable udev symlink to the Seeed OSRbot ESP32.
    # The board enumerates as a native USB-CDC port, so baud_rate is ignored.
    port_name: "/dev/osrbot_base"
    baud_rate: 115200

    # ---- Drive command mapping (normalized /motor -> firmware "v <m/s> <deg>") ----
    # speed_mps  = clamp(/motor.speed, -1, 1)        * max_speed_mps
    # steer_deg  = clamp(/motor.steering_angle,-1,1) * max_steering_angle_deg + steering_trim_deg
    max_speed_mps: 6.0          # m/s at full normalized throttle (tune on-car)
    max_steering_angle_deg: 30.0
    # Stays 0. The steering trim is set in the ESP32 firmware with `trim set`,
    # which also trims manual driving. Positive steers left.
    steering_trim_deg: 0.0

    # ---- Frames ----
    imu_frame: "imu_link"
    odom_frame: "odom"
    base_frame: "base_link"     # the floor point under the rear axle (config/frames.yaml)

    # ---- IMU axes (REP-103) ----
    # /imu/fused and /mag are REP-103 body axes: x forward, y left, z up.
    # out[i] = sign[i] * in[order[i]] on the firmware's values. The dev car
    # reads REP-103 with the identity (2026-11-12, docs/esp32_protocol.md):
    # level accel z +10.0, nose down accel x -4.5, left side down accel y
    # -4.9, a left turn gyro z positive. A board mounted another way is fixed
    # in the car profile, params/controller.yaml, with no code change; the
    # firmware's /odom yaw stays in the board's own axes. An
    # accel/gyro remap other than the identity marks the firmware's
    # orientation unknown, since the firmware fuses it in the board's axes.
    imu.accel_gyro_axis_order: [0, 1, 2]
    imu.accel_gyro_axis_sign: [1.0, 1.0, 1.0]
    # The magnetometer's axes have not been checked on a car yet.
    imu.mag_axis_order: [0, 1, 2]
    imu.mag_axis_sign: [1.0, 1.0, 1.0]

    # ---- Optional publications ----
    # odom -> base_link TF is owned by the EKF in the autonomy base
    # service (robot_localization fusing /odom + IMU). Turn this on only if
    # the autonomy service is disabled and something still needs raw-odom TF.
    publish_tf: false
    publish_mag: true           # firmware emits "m"; feeds rc.physics.get_magnetic_field()
    publish_joy: true           # synthesize /joy from the FlySky "r" channels

    # ================= FlySky RC -> /joy mapping =================
    # The ESP32 "r" line carries 10 RC channels as raw SBUS counts, 0 to 2047,
    # and -1 on every channel on receiver failsafe. With the mode switch down
    # (autonomy) a lost handset is not reported: the line repeats the last values.
    # Indices are 0-based into "r": steering 0, throttle 2, mode switch 6
    # (radio Ch7), speed switch 7 (radio Ch8), confirmed on the dev car's handset.
    #
    # SBUS count calibration, measured on the dev car's handset (2026-11-11):
    # sticks 240 to 1807, centre 1023. A handset with other end points gets
    # its own values in the car profile, params/controller.yaml. When the
    # calibration changes, recompute mode_high_thresh below as
    # (1500 - rc_center) / (rc_max - rc_center).
    rc_min: 240
    rc_center: 1023
    rc_max: 1807
    rc_deadband: 0.05           # normalized; |value| below this snaps to 0
    rc_failsafe_below: 0        # only the firmware's -1 is no-signal -> neutral

    # Joy frame shape. Triggers (axes 2 & 5) rest at +1.0 to match the Xbox
    # convention the student library and the mux arming check assume.
    joy_num_axes: 6
    joy_num_buttons: 11
    joy_trigger_axes: [2, 5]

    # Driving sticks. axes[1]=throttle and axes[3]=steering match gamepad_node
    # defaults and the student library's left-stick-Y / right-stick-X reads.
    throttle_axis: 1
    throttle_channel: 2         # radio Ch3, the throttle stick
    throttle_sign: 1
    steering_axis: 3
    steering_channel: 0         # radio Ch1, the right stick
    steering_sign: 1

    # Mode switch -> manual / autonomy enable buttons (button 4 / LB, button 5 / RB).
    # The ESP32 firmware selects who drives from the mode switch: a count below 1500
    # (switch up, or the middle position) is manual, 1500 or more (switch down)
    # is autonomy. The thresholds below give the same two states on /joy:
    # (1500 - 1023) / (1807 - 1023) = 0.608, and nothing reads as idle.
    # The mux runs with autonomy_passthrough on, so these buttons do not gate
    # driving; they let the student controller API see the switch.
    mode_channel: 6             # radio Ch7, the mode switch
    mode_mid_thresh: -1.0
    mode_high_thresh: 0.608
    mode_idle_button: -1        # -1 = no button; only a failsafe frame sets no button
    mode_manual_button: 4
    mode_autonomy_button: 5

    # Generic extra 2-position switches -> arbitrary Joy buttons (parallel lists).
    # Leave empty unless you need to surface more FlySky switches to the student API.
    aux_button_channels: []
    aux_button_indices: []
    aux_button_thresh: 0.5
