# slam_toolbox localization (localization_slam_toolbox_node), started by
# autonomy.launch.py with mode:=localization localizer:=slam_toolbox, which
# sets map_file_name and map_start_pose. Values follow the package's
# mapper_params_localization.yaml except where commented. Per-car overrides go
# in the car profile, params/slam_localization.yaml.
#
# Humble's slam_toolbox (2.6.10) is a plain node; see slam_mapping.yaml for
# the keys this file leaves out.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link             # as slam_mapping.yaml
    scan_topic: /scan                 # the LakiBeam, frame laser
    mode: localization

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05    # map -> odom at 20 Hz; it changes with each scan match (about 2 Hz)
    map_update_interval: 5.0
    resolution: 0.05
    min_laser_range: 0.3              # self-returns; see slam_mapping.yaml
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.25     # as slam_mapping.yaml
    minimum_travel_heading: 0.25
    scan_buffer_size: 3
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    do_loop_closing: true
    loop_match_minimum_chain_size: 3
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    loop_search_maximum_distance: 3.0

    # Odometry weighting as slam_mapping.yaml.
    distance_variance_penalty: 0.1
    angle_variance_penalty: 0.03

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.5
    minimum_distance_penalty: 0.3
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
