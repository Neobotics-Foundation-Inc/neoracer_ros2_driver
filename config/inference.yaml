inference_node:
  ros__parameters:
    # Weights: absolute path, a filename inside the package's share/models,
    # or a bare Ultralytics name that it fetches and caches on first run.
    # The committed .engine is a TensorRT build for this fleet's exact
    # configuration (SM 8.7, TensorRT 10.3.0.30, JetPack L4T R36.4.3) and is
    # roughly 2.4x faster than the .pt. A car that cannot deserialize it falls
    # back to yolo26n.pt automatically and says so in the log; rebuild with
    # `racecar compile` there.
    model_path: "yolo26n.engine"
    device: "0"          # CUDA device index, or "cpu"
    imgsz: 640
    half: false          # FP16 for .pt on GPU; an .engine carries its own precision
    score_threshold: 0.5
    iou_threshold: 0.45
    max_detections: 10
    # Restrict to specific class indices, e.g. [0, 2] for person and car.
    # Omit the key entirely to keep every class the model knows.
    # class_filter: [0]

    image_topic: "/camera/color"
    detections_topic: "/edgetpu/inference"
    # Cap inference below the camera's 60 fps; the newest frame always wins.
    max_rate_hz: 15.0

    # Overlay for the dashboard and for `ros2 run rqt_image_view`. Encoded only
    # while something is subscribed, so leaving it on costs nothing idle.
    publish_annotated: false
    annotated_topic: "/edgetpu/inference/image"
    annotated_quality: 80

    diagnostics_period_sec: 1.0
    image_timeout_sec: 5.0
    warmup: true
