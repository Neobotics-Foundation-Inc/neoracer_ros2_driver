throttle_node:
  ros__parameters:
    # Single source of truth for top speed. Fractions of /motor, which the
    # controller maps to m/s (max_speed_mps) and degrees (max_steering_angle_deg)
    # in controller.yaml. Speed runs the full range. Steering stays at 0.625
    # (the v1 +/-2500 offset): past that the servo is commanded beyond full
    # lock and stalls against the linkage.
    max_speed_forward: 1.0
    max_speed_backward: 1.0
    max_steering: 0.625
    # While mapping (/autonomy/status mode mapping), /motor speed is clipped to
    # this, after the per-direction caps above. It is a fraction of
    # max_speed_mps in controller.yaml: 0.083 x 6.0 m/s is about 0.5 m/s, so
    # change it with max_speed_mps. Smaller commands pass unchanged; the ESP32
    # speed loop has no floor. The 0.5 m/s speed hold check on the car confirms
    # the value.
    mapping_speed_cap: 0.083
    # While mapping, /motor steering is clipped to this; 1.0 is off. It is a
    # fraction of /motor steering, which max_steering already limits to 0.625,
    # so any value of 0.625 or more is off. Not tuned on the NeoRacer yet.
    mapping_steering_cap: 1.0
    # No steering trim here. The trim is set in the ESP32 firmware with
    # `trim set`, so it also applies to manual driving, and steering_trim_deg
    # in controller.yaml stays 0.
