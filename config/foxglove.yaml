# foxglove_bridge, started by autonomy.launch.py with foxglove:=true (the
# autonomy unit's AUTONOMY_FOXGLOVE=1), for Lichtblick or Foxglove: the map,
# scan, frames, and poses; camera streams are left out because they can
# saturate the car's 2.4 GHz access point. Upstream limits client publishing
# to /initialpose, for the pose estimate tool. foxglove_bridge 3.x reads
# client_topic_whitelist but does not apply it, so with clientPublish a client
# can publish on any topic, /drive and /motor included.
# Per-car overrides go in the car profile, params/foxglove.yaml.
#
# Every key below exists in Humble's foxglove_bridge 3.4.3, the version on the
# dev car. The bridge listens on every interface (its default address,
# 0.0.0.0) and has no password, so any device that reaches the car on port
# 8765 can view the topics below. The car does not limit ROS discovery to
# itself, so a laptop with ROS 2 on the same network already reaches every
# topic without the bridge. A per-car `address` limits the bridge to one
# interface.
foxglove_bridge:
  ros__parameters:
    port: 8765
    topic_whitelist:
      - '^/map$'
      - '^/map_metadata$'
      - '^/scan$'
      - '^/tf$'
      - '^/tf_static$'
      - '^/robot_description$'
      - '^/odom$'
      - '^/odom/integrated$'
      - '^/amcl_pose$'
      - '^/particle_cloud$'
      - '^/autonomy/.*'
    capabilities: [clientPublish]
    client_topic_whitelist: ['^/initialpose$']
    service_whitelist: ['^$']
    param_whitelist: ['^$']
