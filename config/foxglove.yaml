# foxglove_bridge, started by autonomy.launch.py with foxglove:=true (the
# autonomy unit's AUTONOMY_FOXGLOVE=1). View-only for Lichtblick or Foxglove:
# the map, scan, frames, and poses; camera streams are left out because they
# can saturate the car's 2.4 GHz access point. A client publishes nothing;
# see capabilities below.
# Per-car overrides go in the car profile, params/foxglove.yaml.
#
# Every key below exists in Humble's foxglove_bridge 3.4.3, the version on the
# dev car. The bridge listens on every interface (its default address,
# 0.0.0.0) and has no password, so any device that reaches the car on port
# 8765 can view the topics below. The car does not limit ROS discovery to
# itself, so a laptop with ROS 2 on the same network already reaches every
# topic without the bridge. A per-car `address` limits the bridge to one
# interface.
foxglove_bridge:
  ros__parameters:
    port: 8765
    topic_whitelist:
      - '^/map$'
      - '^/map_metadata$'
      - '^/scan$'
      - '^/tf$'
      - '^/tf_static$'
      - '^/robot_description$'
      - '^/odom$'
      - '^/odom/integrated$'
      - '^/amcl_pose$'
      - '^/particle_cloud$'
      - '^/autonomy/.*'
    # Upstream sets clientPublish with /initialpose as the one client topic,
    # for the 3D panel's pose estimate tool. foxglove_bridge 3.4.3, the dev
    # car's version, reads client_topic_whitelist but does not apply it, and
    # 3.6.0 has the same gap (foxglove-sdk PR #1508, open). With clientPublish,
    # a client can publish any topic, /drive and /motor included. The list
    # below holds no capability until a bridge release applies the whitelist.
    # Humble cannot load an empty list from a parameter file, and the bridge
    # ignores names that are not capabilities, so 'none' stands for the empty
    # list. A car profile override can set [clientPublish] again for the pose
    # estimate tool. On these bridge releases that override lets a client
    # publish on any topic again, not only /initialpose.
    capabilities: ['none']
    client_topic_whitelist: ['^/initialpose$']
    service_whitelist: ['^$']
    param_whitelist: ['^$']
