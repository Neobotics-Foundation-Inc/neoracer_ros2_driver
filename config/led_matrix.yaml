led_matrix_node:
  ros__parameters:
    # Stable udev symlink to the 8x8 display's USB-UART adapter.
    port: "/dev/osrbot_led_matrix"
    baud: 115200
    input_topic: "/dotmatrix/text"
    append_newline: true
    # Frame the panel carries when no lab is driving it. Written on startup and
    # on shutdown; set to " " for a blank idle panel.
    idle_text: "N"
